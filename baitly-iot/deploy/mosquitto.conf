# Mosquitto 2.0.x; dedicated IoT host/VM only. No plaintext listener.
# Mount certificates and ACLs read-only. CA signing keys NEVER belong on this host.
# Keep listener-scoped options inside their blocks to avoid an implicit plaintext listener.
per_listener_settings true
persistence false
retain_available false
message_size_limit 4096
max_packet_size 8192
max_inflight_messages 8
max_queued_messages 32
max_queued_bytes 131072
memory_limit 67108864
set_tcp_nodelay true
log_type error
log_type warning
connection_messages false

# Public device ingress. Only our dedicated device CA can issue identities.
listener 8883
protocol mqtt
max_qos 1
allow_anonymous false
require_certificate true
use_identity_as_username true
use_username_as_clientid true
tls_version tlsv1.2
cafile /etc/baitly-mqtt/tls/devices-ca.crt
certfile /etc/baitly-mqtt/tls/server.crt
keyfile /etc/baitly-mqtt/tls/server.key
acl_file /etc/baitly-mqtt/devices.acl
max_connections 128

# Private ingestion connection, separate CA. Never publish this port to the Internet.
listener 8884 127.0.0.1
protocol mqtt
max_qos 1
allow_anonymous false
require_certificate true
use_identity_as_username true
use_username_as_clientid true
tls_version tlsv1.2
cafile /etc/baitly-mqtt/tls/ingestion-ca.crt
certfile /etc/baitly-mqtt/tls/server.crt
keyfile /etc/baitly-mqtt/tls/server.key
acl_file /etc/baitly-mqtt/ingestion.acl
max_connections 2
