# Reference for a dedicated IoT edge, never include this as the PMS nginx configuration.
# TLS files must be mounted read-only by infrastructure CI/CD. No administrative route is proxied.
events { worker_connections 512; }
http {
    server_tokens off;
    log_format baitly_ingress '$remote_addr $request_method $uri $status $request_time';
    access_log /var/log/nginx/access.log baitly_ingress;
    limit_req_zone $binary_remote_addr zone=baitly_peer_rate:1m rate=4r/s;
    limit_req_zone $server_name zone=baitly_global_rate:1m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=baitly_peer_connections:1m;
    limit_conn_zone $server_name zone=baitly_global_connections:1m;
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 4k;
        client_header_timeout 5s;
        client_body_timeout 5s;
        keepalive_timeout 10s;
        large_client_header_buffers 2 4k;
        limit_req_status 429;
        limit_conn_status 429;
        limit_conn baitly_peer_connections 10;
        limit_conn baitly_global_connections 128;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location = /api/v1/measurements {
            if ($request_method != POST) { return 404; }
            if ($args != "") { return 400; }
            limit_req zone=baitly_peer_rate burst=10 nodelay;
            limit_req zone=baitly_global_rate burst=40 nodelay;
            proxy_pass http://127.0.0.1:8095;
            proxy_http_version 1.1;
            proxy_request_buffering on;
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            proxy_set_header Host "127.0.0.1";
            proxy_set_header Connection "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Cookie "";
        }
        location / { return 404; }
    }
}
