# Separate IoT VM: include inside the dedicated edge's http block through infrastructure CI/CD.
# Restrict the source to the PMS in the VM firewall. The API also requires its service token.
server {
    listen 8444 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4k;
    client_body_timeout 5s;
    location /internal/v1/ {
        proxy_pass http://127.0.0.1:8096;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_set_header Host "127.0.0.1";
        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Cookie "";
    }
    location / { return 404; }
}
