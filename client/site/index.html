<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Faites grandir vos revenus. Pas votre charge de travail. Un PMS avec des agents IA, pensé pour les réglementations saoudienne, marocaine et française."
    />
    <!-- Configuration d'EXECUTION (URL de l'API, du PMS). Ecrite par le
         conteneur a son demarrage, pas gravee dans le bundle : une image
         unique sert ainsi baitly.fr et toute autre instance. -->
    <script src="/baitly-config.js"></script>
    <meta name="theme-color" content="#1B2A35" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_SA" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta
      property="og:title"
      content="Baitly | Faites grandir vos revenus. Pas votre charge de travail."
    />
    <meta
      property="og:description"
      content="Automatisez votre gestion et développez vos revenus avec les agents IA de Baitly. Un PMS pensé pour les réglementations saoudienne, marocaine et française."
    />
    <!-- Les deux fontes que la landing partage avec l'application :
         Space Grotesk pour le mot-symbole (cf. BaitlyMarkLogo) et Tajawal
         pour l'arabe, afin que les deux surfaces se lisent pareil. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap"
    />
    <title>Baitly | Faites grandir vos revenus. Pas votre charge de travail.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
