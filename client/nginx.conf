# Generated only by the marketing build; absent from the PMS image.
include /etc/nginx/baitly-discovery/*-http.conf;
# Carte Baitly : zone de cache du relais /maps/ (absente si le relais est desactive).
include /etc/nginx/baitly-maps/*.http;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/baitly-discovery/*-server.conf;
  # Academie Baitly : relais des videos vers le stockage objet, ecrit au demarrage
  # par docker-runtime-config.sh (absent tant que BAITLY_ACADEMY_MEDIA_ORIGIN est vide).
  include /etc/nginx/baitly-academy/*.conf;
  # Carte Baitly : relais /maps/ vers le conteneur public des cartes (ou 404),
  # ecrit au demarrage par docker-runtime-config.sh selon BAITLY_MAPS_ORIGIN.
  include /etc/nginx/baitly-maps/*.conf;

  # Crawl policy must be a real UTF-8 text file, never the SPA HTML fallback.
  # Each Vite build copies its own public/robots.txt to the document root.
  location = /robots.txt {
    types { }
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "public, max-age=3600";
    include /etc/nginx/baitly-discovery/*-robots.conf;
    try_files $uri =404;
  }

  location = /sitemap.xml {
    types { }
    default_type application/xml;
    charset utf-8;
    charset_types application/xml;
    add_header Cache-Control "public, max-age=3600";
    include /etc/nginx/baitly-discovery/*-sitemap.conf;
    try_files $uri =404;
  }

  # Dedicated video discovery; a missing file must never return the PMS SPA.
  location = /sitemap-videos.xml {
    types { }
    default_type application/xml;
    charset utf-8;
    charset_types application/xml;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # ─── Configuration d'execution ─────────────────────────────────────────────
  # Reecrit a CHAQUE demarrage du conteneur par
  # /docker-entrypoint.d/40-baitly-runtime-config.sh : il porte l'URL de l'API
  # et celle de Keycloak, qui different d'une instance a l'autre.
  #
  # CRITIQUE : sans cette regle, la regle `\.(?:js|...)$` juste en dessous le
  # servirait en `immutable` pour 1 an. La configuration resterait alors figee
  # dans le navigateur de chaque visiteur, et un changement de domaine (ou le
  # deploiement d'une seconde instance) ne serait jamais pris en compte.
  # `location =` est une correspondance EXACTE : elle prime sur toutes les
  # expressions regulieres, quelle que soit leur position dans le fichier.
  location = /baitly-config.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires -1;
    try_files $uri =404;
  }

  # ─── Assets hashes par Vite (filename.HASH.ext) ────────────────────────────
  # Le hash dans le filename garantit qu'un nouveau build = nouveau filename ;
  # on peut donc cacher 1 an + immutable sans risque d'obsolescence.
  location ~* \.(?:js|mjs|css|woff2?|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    access_log off;
    try_files $uri =404;
  }

  # ─── Images / icones ───────────────────────────────────────────────────────
  # Pas hashees, on cache 7 jours.
  location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    access_log off;
    try_files $uri =404;
  }

  # ─── SPA fallback : index.html + routes virtuelles ─────────────────────────
  # CRITIQUE : pas de cache sur le HTML, sinon apres un deploy le browser
  # continue de charger l'ancien index.html (qui pointe vers d'anciens chunks
  # JS hashes qui n'existent plus) → ecran blanc ou bug d'integration. Le
  # no-cache force le browser a revalider a chaque navigation.
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri $uri/ @site_fallback;
  }

  location @site_fallback {
    # The marketing build provides a real 404. The PMS keeps its SPA fallback.
    include /etc/nginx/baitly-discovery/*-fallback.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /index.html =404;
  }

  gzip on;
  gzip_types text/plain application/javascript text/css application/json image/svg+xml;
}
