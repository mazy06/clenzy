# ===========================================
# Baitly — CI du relais AG-UI compatible (identifiants historiques conservés)
# ===========================================
# Relais Node optionnel compatible avec /api/copilotkit. Le chat natif appelle
# directement Java (/api/agui/run) ; les compositions staging/production
# n'ont aucun service copilot-runtime à déployer.
#
# Flux (miroir de ci-frontend.yml / ci-backend.yml) :
#   - push main/develop  -> CI (install + smoke) + push image GHCR
#   - push production    -> CI + push image GHCR (:latest), sans dispatch infra
#   - PR main/develop/production -> CI obligatoire (gate de validation)
#
# IMPORTANT : Les merges vers production ne sont autorises que via Pull Request.

name: CI Copilot Runtime

on:
  push:
    branches: [main, develop, production]
    paths:
      - 'copilot-runtime/**'
      - '.github/workflows/ci-copilot-runtime.yml'
  pull_request:
    branches: [main, develop, production]
    paths:
      - 'copilot-runtime/**'
      - '.github/workflows/ci-copilot-runtime.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/clenzy-copilot-runtime

jobs:
  install-and-check:
    name: Install & Smoke Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: copilot-runtime/package-lock.json

      - name: Install dependencies (deterministic)
        working-directory: copilot-runtime
        run: npm ci

      # Pas de TypeScript (server.mjs en JS pur) : on verifie au minimum que le
      # module se parse sans erreur de syntaxe.
      - name: Syntax check (node --check)
        working-directory: copilot-runtime
        run: node --check server.mjs

      - name: Verify proxy trust security contracts
        working-directory: copilot-runtime
        run: npm run test:security

      - name: Reject high and critical runtime dependency advisories
        working-directory: copilot-runtime
        run: npm audit --omit=dev --audit-level=high

  docker-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: install-and-check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/production')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Mirror GCR d'abord (registry-1.docker.io timeout par intermittence), repli Docker Hub.
      - name: Set up Docker Buildx (mirror GCR)
        id: buildx-mirror
        continue-on-error: true
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Set up Docker Buildx (fallback Docker Hub)
        if: steps.buildx-mirror.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/production' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: copilot-runtime
          file: copilot-runtime/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
