name: Baitly professional directory sources

on:
  workflow_call:
    inputs:
      saudi_only:
        type: boolean
        default: true
  schedule:
    - cron: '41 3 * * 0'
  workflow_dispatch:
    inputs:
      publish:
        description: Publier les sources ouvertes communes après promotion sur production
        type: boolean
        default: false
  push:
    branches: [production]
    paths:
      - scripts/directory/**
      - .github/workflows/baitly-directory-sources.yml

permissions:
  contents: read

concurrency:
  group: baitly-directory-sources
  cancel-in-progress: false

jobs:
  public-source:
    if: ${{ !inputs.saudi_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'production' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier les règles de publication
        env:
          PUBLISH: ${{ inputs.publish || github.event_name == 'push' || github.event_name == 'schedule' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$PUBLISH" = true ] && [ "$GITHUB_REF" != refs/heads/production ] && [ "$EVENT_NAME" != schedule ]; then
            echo 'La source publique commune nécessite une promotion sur production.' >&2
            exit 1
          fi
      - name: Installer et vérifier les outils
        run: |
          pip install -r scripts/directory/requirements.txt certifi
          python -m unittest discover -s scripts/directory -p 'test_*.py'
      - name: Extraire les seules données publiques OSM
        run: python scripts/directory/build_baitly_osm_snapshot.py --out /tmp/baitly-directory
      - uses: actions/upload-artifact@v4
        with:
          name: baitly-directory-public-source
          path: |
            /tmp/baitly-directory/osm-*.jsonl
            /tmp/baitly-directory/latest.json
          retention-days: 7
      - name: Publier la source vérifiée commune aux environnements
        if: github.event_name == 'schedule' || (github.ref == 'refs/heads/production' && (inputs.publish || github.event_name == 'push'))
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BAITLY_MAPS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BAITLY_MAPS_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: gra
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY"
          python -c 'import hashlib,json,pathlib; p=pathlib.Path("/tmp/baitly-directory"); m=json.loads((p/"latest.json").read_text()); b=(p/("osm-"+m["sha256"]+".jsonl")).read_bytes(); assert len(b)==m["bytes"] and hashlib.sha256(b).hexdigest()==m["sha256"] and m["licence"]=="ODbL 1.0"'
          for file in /tmp/baitly-directory/osm-*.jsonl; do
            aws s3 cp "$file" "s3://baitly-cartes/maps/directory/$(basename "$file")" --endpoint-url https://s3.gra.io.cloud.ovh.net --acl public-read --no-progress --content-type application/x-ndjson --cache-control 'public, max-age=31536000, immutable'
          done
          # Publish the manifest last. Consumers never observe a partial immutable snapshot.
          aws s3 cp /tmp/baitly-directory/latest.json s3://baitly-cartes/maps/directory/latest.json --endpoint-url https://s3.gra.io.cloud.ovh.net --acl public-read --no-progress --content-type application/json --cache-control 'public, max-age=300'

  saudi-public-source:
    strategy:
      fail-fast: false
      matrix:
        country: [SA, MA]
    env:
      COUNTRY: ${{ matrix.country }}
      SOURCE_FOLDER: /tmp/baitly-directory/${{ matrix.country }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'production' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer et tester les extracteurs nationaux
        run: |
          pip install -r scripts/directory/requirements.txt certifi
          python -m unittest discover -s scripts/directory -p 'test_baitly_*.py'
      - name: Construire les éditions nationales OSM et Overture
        run: |
          python scripts/directory/build_baitly_saudi_osm_snapshot.py --country "$COUNTRY" --out "$SOURCE_FOLDER"
          python scripts/directory/build_baitly_saudi_public_snapshot.py --country "$COUNTRY" --out "$SOURCE_FOLDER"
          if [ "$COUNTRY" = MA ]; then
            python scripts/directory/enrich_baitly_morocco_websites.py --out "$SOURCE_FOLDER"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: baitly-directory-${{ matrix.country }}-public-source
          path: |
            /tmp/baitly-directory/${{ matrix.country }}/public-*.jsonl
            /tmp/baitly-directory/${{ matrix.country }}/latest.json
            /tmp/baitly-directory/${{ matrix.country }}/review.jsonl
            /tmp/baitly-directory/${{ matrix.country }}/website-review.jsonl
            /tmp/baitly-directory/${{ matrix.country }}/website-report.json
            /tmp/baitly-directory/${{ matrix.country }}/licenses/*.txt
          retention-days: 7
      - name: Publier l’édition nationale complète
        if: github.event_name == 'schedule' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && (github.event_name == 'push' || inputs.publish))
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BAITLY_MAPS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BAITLY_MAPS_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: gra
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY"
          python -c 'import hashlib,json,pathlib,os; p=pathlib.Path(os.environ["SOURCE_FOLDER"]); m=json.loads((p/"latest.json").read_text()); b=(p/("public-"+m["manifest"]["sha256"]+".jsonl")).read_bytes(); assert len(b)==m["bytes"] and hashlib.sha256(b).hexdigest()==m["manifest"]["sha256"] and m["manifest"]["source"]==os.environ["COUNTRY"]+"_PUBLIC" and m["manifest"]["country"]==os.environ["COUNTRY"]'
          for file in /tmp/baitly-directory/${{ matrix.country }}/public-*.jsonl; do
            aws s3 cp "$file" "s3://baitly-cartes/maps/directory/${COUNTRY,,}/$(basename "$file")" --endpoint-url https://s3.gra.io.cloud.ovh.net --acl public-read --no-progress --content-type application/x-ndjson --cache-control 'public, max-age=31536000, immutable'
          done
          aws s3 cp /tmp/baitly-directory/${{ matrix.country }}/licenses s3://baitly-cartes/maps/directory/${COUNTRY,,}/licenses/ --recursive --endpoint-url https://s3.gra.io.cloud.ovh.net --acl public-read --no-progress --content-type text/plain --cache-control 'public, max-age=300'
          aws s3 cp /tmp/baitly-directory/${{ matrix.country }}/latest.json s3://baitly-cartes/maps/directory/${COUNTRY,,}/latest.json --endpoint-url https://s3.gra.io.cloud.ovh.net --acl public-read --no-progress --content-type application/json --cache-control 'public, max-age=300'
          # A successful authenticated upload does not prove that backend consumers can read it.
          python scripts/directory/verify_baitly_public_source.py --country "$COUNTRY" --out "$SOURCE_FOLDER"
