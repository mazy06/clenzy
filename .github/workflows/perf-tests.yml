# ===========================================
# Clenzy — Tests de Performance & Charge (K6)
# ===========================================
# Declenchement :
#   - PR vers production          → smoke + load test (validation obligatoire)
#   - workflow_dispatch (manuel)  → choix du type de test (smoke/load/stress/soak)
#
# Prerequis :
#   - K6 installe dans le runner
#   - Services backend + DB + Redis up
#   - Profil Spring Boot "ci" (JWT valide par une cle RSA du classpath)
#
# En CI (sans Keycloak) : une paire de cles RSA ephemere est generee a chaque
# run, la publique est embarquee dans le jar et le JWT est signe a la volee.
# Aucun secret longue duree, donc aucun token qui expire en silence.
# En environnement reel : configurer KEYCLOAK_URL + PERF_TEST_USER/PASSWORD.

name: Performance Tests

on:
  pull_request:
    branches: [production]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type de test a executer'
        required: true
        default: 'load'
        type: choice
        options:
          - smoke
          - load
          - stress
          - soak

permissions:
  contents: read
  pull-requests: write

jobs:
  performance-tests:
    name: K6 Performance Tests
    runs-on: ubuntu-latest

    # Identite du compte de charge : le `sub` du JWT signe ci-dessous DOIT etre
    # celui que PerfTestDataSeeder pose en base, sinon le TenantFilter refuse
    # toute requete org-scopee (403) et le test ne mesure plus rien.
    env:
      PERF_SEED_KEYCLOAK_ID: perf-test-00000000-0000-0000-0000-000000000001

    services:
      postgres:
        # pgvector requis : l'app boote en ddl-auto et cree assistant_memory (embedding vector(1024)).
        # Aligne l'env perf sur dev/prod (pgvector/pgvector:pg15) — postgres:15-alpine n'a pas le type "vector".
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: clenzy_perf
          POSTGRES_USER: clenzy_perf
          POSTGRES_PASSWORD: clenzy_perf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clenzy_perf -d clenzy_perf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── JWT de CI : paire de cles ephemere ──
      # La cle publique est un resource du classpath (application-ci.yml pointe
      # dessus via public-key-location) : elle doit etre en place AVANT le
      # package, sinon le jar embarque l'ancienne et la signature est rejetee.
      - name: Generate ephemeral JWT keypair
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/ci-jwt-private.pem
          openssl rsa -in /tmp/ci-jwt-private.pem -pubout -out server/src/main/resources/ci-jwt-public.pem

      - name: Mint CI JWT
        run: |
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }

          NOW=$(date +%s)
          EXP=$((NOW + 7200))   # couvre le soak test (28 min) avec de la marge

          HEADER=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
          PAYLOAD=$(printf '{"sub":"%s","preferred_username":"perf-test","email":"perf-test@baitly.fr","realm_access":{"roles":["HOST"]},"iat":%s,"nbf":%s,"exp":%s}' \
            "$PERF_SEED_KEYCLOAK_ID" "$NOW" "$NOW" "$EXP" | b64url)

          SIGNATURE=$(printf '%s.%s' "$HEADER" "$PAYLOAD" \
            | openssl dgst -sha256 -sign /tmp/ci-jwt-private.pem | b64url)

          echo "CI_AUTH_TOKEN=${HEADER}.${PAYLOAD}.${SIGNATURE}" >> "$GITHUB_ENV"

      # ── Build & start backend ──
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build backend
        working-directory: server
        run: mvn clean package -B -q -DskipTests

      - name: Create upload directories
        run: mkdir -p /tmp/clenzy-ci/uploads/{contact,templates,documents,user-avatars}

      # L'extension est disponible dans l'image pgvector mais doit etre creee dans la base
      # avant le boot (Hibernate ddl-auto cree assistant_memory.embedding vector(1024)).
      - name: Enable pgvector extension
        env:
          PGPASSWORD: clenzy_perf_ci
        run: psql -h localhost -p 5432 -U clenzy_perf -d clenzy_perf -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Start backend
        working-directory: server
        env:
          SPRING_PROFILES_ACTIVE: ci
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/clenzy_perf
          SPRING_DATASOURCE_USERNAME: clenzy_perf
          SPRING_DATASOURCE_PASSWORD: clenzy_perf_ci
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
          SERVER_PORT: 8080
        run: |
          java \
            -Djava.security.egd=file:/dev/./urandom \
            -Xmx512m \
            -jar target/*.jar > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          echo "Backend PID: $BACKEND_PID"
          echo "Waiting for backend to start..."

          for i in $(seq 1 120); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              break
            fi
            if ! kill -0 $BACKEND_PID 2>/dev/null; then
              echo "::error::Backend process crashed. Logs:"
              cat /tmp/backend.log
              exit 1
            fi
            # Print progress every 15s
            if [ $((i % 15)) -eq 0 ]; then
              echo "Still waiting... (${i}s). Last log line:"
              tail -1 /tmp/backend.log
            fi
            if [ "$i" -eq 120 ]; then
              echo "::error::Backend failed to start within 120 seconds. Full logs:"
              cat /tmp/backend.log
              exit 1
            fi
            sleep 1
          done

      # ── Verifier le seed avant de mesurer ──
      # Sans jeu de donnees, le TenantFilter refuse tout en 403 et le load test
      # mesure la chaine de filtres au lieu de l'application. On echoue ici,
      # bruyamment, plutot que de publier des latences flatteuses.
      - name: Resolve seeded property id
        env:
          PGPASSWORD: clenzy_perf_ci
        run: |
          PROPERTY_ID=$(psql -h localhost -p 5432 -U clenzy_perf -d clenzy_perf \
            -tAc "SELECT id FROM properties ORDER BY id LIMIT 1")

          if [ -z "$PROPERTY_ID" ]; then
            echo "::error::Aucun logement seede — PerfTestDataSeeder n'a pas tourne ou a echoue."
            echo "=== Backend logs (seed) ==="
            grep -i "perf\|seed" /tmp/backend.log | tail -30 || tail -50 /tmp/backend.log
            exit 1
          fi

          echo "Logement de perf : id=$PROPERTY_ID"
          echo "PROPERTY_ID=$PROPERTY_ID" >> "$GITHUB_ENV"

      # ── Install K6 ──
      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Create results directory
        run: mkdir -p tests/performance/results

      # ── Determine test type ──
      - name: Determine test type
        id: test-type
        env:
          INPUT_TYPE: ${{ github.event.inputs.test_type || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "type=$INPUT_TYPE" >> "$GITHUB_OUTPUT"
          else
            # PR vers production : smoke + load
            echo "type=pr" >> "$GITHUB_OUTPUT"
          fi

      # ── Smoke Test (toujours execute) ──
      - name: Run Smoke Test
        env:
          BASE_URL: http://localhost:8080
        run: |
          k6 run \
            --out json=tests/performance/results/smoke-results.json \
            --summary-export=tests/performance/results/smoke-summary.json \
            tests/performance/smoke-test.js
        continue-on-error: false

      # ── Load Test (PR ou dispatch 'load') ──
      # Les seuils de perf restent informatifs sur PR (continue-on-error) : une
      # p95 degradee ne bloque pas un deploiement. La validite de la mesure,
      # elle, est verifiee juste apres et bloque dans tous les cas.
      - name: Run Load Test
        if: steps.test-type.outputs.type == 'pr' || steps.test-type.outputs.type == 'load'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_URL: http://localhost:8080
          CI_AUTH_TOKEN: ${{ env.CI_AUTH_TOKEN }}
          PROPERTY_ID: ${{ env.PROPERTY_ID }}
        run: |
          k6 run \
            --out json=tests/performance/results/load-results.json \
            --summary-export=tests/performance/results/load-summary.json \
            tests/performance/load-test.js

      # ── Garde-fou : la mesure est-elle seulement valide ? ──
      # Un taux d'erreur massif n'est pas une regression de perf, c'est un
      # harnais casse (token rejete, seed absent, endpoint renomme). Dans ce cas
      # les latences affichees ne mesurent qu'un refus : on echoue, y compris
      # sur PR ou les seuils de perf, eux, restent informatifs.
      - name: Verify load test measured something
        if: steps.test-type.outputs.type == 'pr' || steps.test-type.outputs.type == 'load'
        run: |
          SUMMARY=tests/performance/results/load-summary.json

          if [ ! -f "$SUMMARY" ]; then
            echo "::error::Aucun resume de load test — K6 n'a pas produit de resultat."
            exit 1
          fi

          FAIL_RATE=$(jq -r '.metrics.http_req_failed.value // 1' "$SUMMARY")

          if jq -e '(.metrics.http_req_failed.value // 1) > 0.5' "$SUMMARY" > /dev/null; then
            echo "::error::Taux d'erreur de $(jq -r '(.metrics.http_req_failed.value * 100 | round)' "$SUMMARY")% — le load test n'a pas mesure l'application."
            echo "Repartition des reponses :"
            jq -r 'select(.type == "Point" and .metric == "http_reqs")
                   | "\(.data.tags.status) \(.data.tags.name)"' \
              tests/performance/results/load-results.json 2>/dev/null \
              | sort | uniq -c | sort -rn | head -10 || true
            echo "=== Backend logs ==="
            tail -80 /tmp/backend.log || true
            exit 1
          fi

          echo "Taux d'erreur : ${FAIL_RATE} — mesure valide."

      # ── Stress Test (dispatch only) ──
      - name: Run Stress Test
        if: steps.test-type.outputs.type == 'stress'
        env:
          BASE_URL: http://localhost:8080
          CI_AUTH_TOKEN: ${{ env.CI_AUTH_TOKEN }}
          PROPERTY_ID: ${{ env.PROPERTY_ID }}
        run: |
          k6 run \
            --out json=tests/performance/results/stress-results.json \
            --summary-export=tests/performance/results/stress-summary.json \
            tests/performance/stress-test.js

      # ── Soak Test (dispatch only) ──
      - name: Run Soak Test
        if: steps.test-type.outputs.type == 'soak'
        env:
          BASE_URL: http://localhost:8080
          CI_AUTH_TOKEN: ${{ env.CI_AUTH_TOKEN }}
          PROPERTY_ID: ${{ env.PROPERTY_ID }}
        run: |
          k6 run \
            --out json=tests/performance/results/soak-results.json \
            --summary-export=tests/performance/results/soak-summary.json \
            tests/performance/soak-test.js

      # ── Show backend logs on failure ──
      - name: Show backend logs
        if: failure()
        run: |
          echo "=== Backend logs ==="
          cat /tmp/backend.log || echo "No backend log file found"

      # ── Upload results ──
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: tests/performance/results/
          retention-days: 30

      # ── Post summary as PR comment ──
      # Le tableau rend le VERDICT de chaque seuil, pas seulement sa valeur :
      # une colonne "Threshold" jamais evaluee laissait croire a une mesure
      # validee alors que K6 sortait en echec.
      - name: Post PR comment with results
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          RESULTS=tests/performance/results
          COMMENT=$RESULTS/pr-comment.md

          # Format --summary-export (plat) : .metrics.<name>.<stat>, PAS .values.<stat>
          # (le niveau "values" n'existe que dans les donnees handleSummary de k6).
          num() {
            jq -r --arg m "$2" --arg k "$3" \
              '.metrics[$m][$k] // "N/A" | if type == "number" then (. * 100 | round) / 100 else . end' "$1"
          }
          pct() {
            jq -r --arg m "$2" --arg k "$3" \
              '.metrics[$m][$k] // "N/A" | if type == "number" then "\((. * 10000 | round) / 100)%" else . end' "$1"
          }
          # Dans le summary-export, le booleen vaut true quand le seuil est FRANCHI.
          # Piege : `// null` ne convient pas ici, l'operateur avale aussi false.
          verdict() {
            jq -r --arg m "$2" --arg t "$3" \
              '(.metrics[$m].thresholds[$t]) as $breached
               | if $breached == null then "—" elif $breached then "❌" else "✅" end' "$1"
          }
          breached() {
            jq '[.metrics[].thresholds // {} | to_entries[] | select(.value)] | length' "$1"
          }

          TOTAL_BREACHED=0
          for f in $RESULTS/smoke-summary.json $RESULTS/load-summary.json; do
            [ -f "$f" ] && TOTAL_BREACHED=$((TOTAL_BREACHED + $(breached "$f")))
          done

          echo "## Performance Test Results" > $COMMENT
          echo "" >> $COMMENT
          if [ "$TOTAL_BREACHED" -eq 0 ]; then
            echo "**Verdict : tous les seuils sont tenus.**" >> $COMMENT
          else
            echo "**Verdict : ${TOTAL_BREACHED} seuil(s) franchi(s)** — detail ci-dessous." >> $COMMENT
          fi
          echo "" >> $COMMENT

          # Smoke test summary
          SMOKE=$RESULTS/smoke-summary.json
          if [ -f "$SMOKE" ]; then
            {
              echo "### Smoke Test"
              echo "| Metric | Value | Threshold | Verdict |"
              echo "|--------|-------|-----------|---------|"
              echo "| Total requests | $(num $SMOKE http_reqs count) | — | — |"
              echo "| p95 latency | $(num $SMOKE http_req_duration 'p(95)')ms | < 1000ms | $(verdict $SMOKE http_req_duration 'p(95)<1000') |"
              echo "| Error rate | $(pct $SMOKE http_req_failed value) | < 5% | $(verdict $SMOKE http_req_failed 'rate<0.05') |"
              echo ""
            } >> $COMMENT
          fi

          # Load test summary
          LOAD=$RESULTS/load-summary.json
          if [ -f "$LOAD" ]; then
            {
              echo "### Load Test (50 VUs)"
              echo "| Metric | Value | Threshold | Verdict |"
              echo "|--------|-------|-----------|---------|"
              echo "| Total requests | $(num $LOAD http_reqs count) | — | — |"
              echo "| p95 latency | $(num $LOAD http_req_duration 'p(95)')ms | < 500ms | $(verdict $LOAD http_req_duration 'p(95)<500') |"
              echo "| p99 latency | $(num $LOAD http_req_duration 'p(99)')ms | < 1500ms | $(verdict $LOAD http_req_duration 'p(99)<1500') |"
              echo "| API p95 | $(num $LOAD api_duration 'p(95)')ms | < 500ms | $(verdict $LOAD api_duration 'p(95)<500') |"
              echo "| Error rate | $(pct $LOAD http_req_failed value) | < 1% | $(verdict $LOAD http_req_failed 'rate<0.01') |"
              echo "| Business errors | $(pct $LOAD business_errors value) | < 5% | $(verdict $LOAD business_errors 'rate<0.05') |"
              echo ""
            } >> $COMMENT
          fi

          {
            echo "---"
            echo "*Genere par le workflow Performance Tests*"
          } >> $COMMENT

          gh pr comment "$PR_NUMBER" --body-file $COMMENT
