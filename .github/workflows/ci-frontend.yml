# ===========================================
# Baitly — CI/CD Frontend (React + TypeScript + Vite)
# ===========================================
# Flux :
#   - push main/develop  → CI (typecheck + build) + push image GHCR
#   - push production    → CI + push image GHCR (:latest) + déclenchement déploiement via clenzy-infra
#   - PR main/develop/production → CI obligatoire (gate de validation)
#
# IMPORTANT : Les merges vers production ne sont autorisées que via Pull Request.
# NOTE : un commit VIDE sur production ne declenche PAS ce workflow (filtres paths) —
# toucher ce fichier ou client/** dans un commit de relance de deploy.

name: CI Frontend

on:
  push:
    branches: [main, develop, production]
    paths:
      - 'client/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main, develop, production]
    paths:
      - 'client/**'
      - '.github/workflows/ci-frontend.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/clenzy-client

jobs:
  typecheck-and-build:
    name: TypeCheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: TypeScript type check
        working-directory: client
        run: npx tsc --noEmit

      - name: Build production bundle
        working-directory: client
        env:
          # Heap Node augmente : le bundle (SDK + app + module supervision) depassait
          # la limite par defaut → "JavaScript heap out of memory" (exit 134) au vite build.
          NODE_OPTIONS: --max-old-space-size=4096
          # Aucune URL ici : depuis la config d'execution, elles sont resolues
          # au demarrage du conteneur (client/docker-runtime-config.sh), pas au
          # build. Ce job ne valide que la compilation du bundle.
          VITE_APP_NAME: Baitly
          VITE_APP_VERSION: ${{ github.sha }}
        run: npm run build

      - name: Validate public discovery content
        working-directory: client
        run: npx vitest run site/lib/discovery.test.ts

      - name: Build marketing site and discovery documents
        working-directory: client
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build:site

      - name: Install native nginx for HTTP checks
        run: sudo apt-get update -qq && sudo apt-get install -y nginx

      - name: Check discovery HTTP responses and PMS isolation
        working-directory: client
        run: python3 tooling/check_baitly_discovery.py --nginx /usr/sbin/nginx

      - name: Check bundle size
        working-directory: client
        run: |
          echo "=== Bundle Analysis ==="
          du -sh dist/
          echo "=== Largest files ==="
          find dist -type f -name "*.js" -exec du -sh {} \; | sort -rh | head -10

      - name: Upload build artifacts
        # L'upload d'artefacts ne doit JAMAIS bloquer le build/deploy : un quota
        # d'artefacts GitHub atteint ("Artifact storage quota has been hit") faisait
        # echouer tout le job (tsc + build OK) et skippait le deploy frontend.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: client/dist/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: NPM audit (high + critical)
        working-directory: client
        run: npm audit --audit-level=critical

  docker-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/production')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Mirror GCR d'abord (registry-1.docker.io timeout par intermittence), repli Docker Hub.
      - name: Set up Docker Buildx (mirror GCR)
        id: buildx-mirror
        continue-on-error: true
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Set up Docker Buildx (fallback Docker Hub)
        if: steps.buildx-mirror.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/production' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: client
          file: client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # PLUS AUCUNE URL en build-arg. Vite substitue `import.meta.env.VITE_*`
          # au build : une URL ici serait gravee dans le bundle et l'image ne
          # pourrait plus servir qu'un seul domaine. Elles viennent desormais des
          # variables d'environnement du conteneur (docker-compose.prod.yml ->
          # /baitly-config.js -> src/config/runtimeConfig.ts), ce qui permet a
          # CETTE image unique de servir clenzy.fr et baitly.fr.
          #
          # On ne remet volontairement PAS app.clenzy.fr en repli : si la config
          # d'execution manquait sur une instance, un repli code en dur la ferait
          # taper EN SILENCE sur le domaine de l'autre instance. Sans repli, elle
          # retombe sur http://localhost:8084 — visiblement casse, donc detecte
          # immediatement.
          build-args: |
            VITE_APP_NAME=Baitly
            VITE_APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-push-site:
    name: Build & Push Docker Image (site Baitly)
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/production')
    # Le site marketing est une seconde app Vite du meme depot (client/site,
    # build:site -> dist-site). Elle a son propre Dockerfile parce qu'elle
    # n'embarque AUCUNE variable de build : ni API, ni Keycloak, ni Stripe.
    #
    # Sans ce job, l'image n'existait pas sur GHCR alors que le compose de prod
    # la referencait : `docker compose pull` echouait sur elle seule et TOUT le
    # deploiement d'infra s'arretait la (constate le 2026-08-29).
    env:
      IMAGE_NAME_SITE: ${{ github.repository_owner }}/clenzy-baitly-site

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Meme resilience que le job PMS : mirror GCR d'abord, repli Docker Hub.
      - name: Set up Docker Buildx (mirror GCR)
        id: buildx-mirror-site
        continue-on-error: true
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Set up Docker Buildx (fallback Docker Hub)
        if: steps.buildx-mirror-site.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta-site
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SITE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/production' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: client
          file: client/Dockerfile.site
          push: true
          tags: ${{ steps.meta-site.outputs.tags }}
          labels: ${{ steps.meta-site.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger deploy via clenzy-infra
    runs-on: ubuntu-latest
    # Les DEUX images doivent exister avant de declencher l'infra : le compose de
    # prod les tire toutes les deux, et une seule manquante fait echouer le pull
    # donc le deploiement entier.
    needs: [docker-push, docker-push-site]
    if: github.ref == 'refs/heads/production'
    env:
      INFRA_REPOSITORY: ${{ vars.INFRA_REPOSITORY || format('{0}/clenzy-infra', github.repository_owner) }}

    steps:
      - name: Validate dispatch configuration
        run: |
          if [ -z "${{ secrets.INFRA_REPO_DISPATCH_TOKEN }}" ]; then
            echo "::error::Missing INFRA_REPO_DISPATCH_TOKEN secret. Add a token that can trigger workflows on ${INFRA_REPOSITORY}."
            exit 1
          fi
          if [ -z "${INFRA_REPOSITORY}" ]; then
            echo "::error::Missing INFRA_REPOSITORY variable."
            exit 1
          fi

      # Ce job construit DEUX images : le PMS (clenzy-client) et la landing
      # (clenzy-baitly-site). Le payload ne demandait le deploiement que du
      # premier, et `deploy.sh` restreint alors son `pull` a ce seul service :
      # la landing n'etait donc JAMAIS redeployee. Invisible tant que
      # SITE_DOMAIN ne pointait nulle part ; sur une instance ou la landing est
      # la page d'accueil, le site restait fige sur une image ancienne.
      - name: Trigger infra deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_REPO_DISPATCH_TOKEN }}
          repository: ${{ env.INFRA_REPOSITORY }}
          event-type: deploy-clenzy-frontend
          client-payload: >-
            {
              "services": "pms-client,baitly-site",
              "environment": "production",
              "image": "ghcr.io/${{ env.IMAGE_NAME }}:latest",
              "source_repo": "${{ github.repository }}",
              "source_ref": "${{ github.ref }}",
              "source_sha": "${{ github.sha }}"
            }
