function geometry() {
  const root = $('scaler');
  const n = posIn(lock.querySelector('.notif'), root);
  const notif = lock.querySelector('.notif');
  const svc = posIn(services, wbContent);
  const scrollEnd = Math.max(0, svc.y - 330);
  const lb = posIn(lateBtn, wbContent);
  return {
    scrollEnd,
    notif: { x: SCR_X + (n.x + notif.offsetWidth / 2) * SCALE, y: SCR_Y + (n.y + notif.offsetHeight / 2) * SCALE },
    book: { x: SCR_X + (lb.x + lateBtn.offsetWidth / 2) * SCALE, y: SCR_Y + (lb.y - scrollEnd + lateBtn.offsetHeight / 2) * SCALE },
  };
}
function payPoint() {
  const p = posIn(payBtn, wb);
  return { x: SCR_X + (p.x + payBtn.offsetWidth / 2) * SCALE, y: SCR_Y + (p.y + payBtn.offsetHeight / 2) * SCALE };
}
let payGeo = null;

/* ---------- rendu à l'instant t ---------- */
function titleIn(ws, t, start, stagger = .06) {
  ws.forEach((w, i) => { const p = easeOut(prog(t, start + i * stagger, .45)); set(w, { opacity: p, transform: `translateY(${lerp(22, 0, p)}px)` }); });
}
let PUSH = 0;
/** Reporte un point de l'écran du téléphone dans la scène, zoom compris. */
function onPhone(pt) {
  const ox = 540, oy = 300 + 1040 * .45, k = 1 + .12 * PUSH;
  return { x: ox + (pt.x - ox) * k, y: oy + (pt.y - oy) * k - 50 * PUSH };
}
function tapAt(t, t0, pt0) {
  const p = prog(t, t0, .5);
  const pt = onPhone(pt0);
  if (p <= 0 || p >= 1) return false;
  set($('tap'), { opacity: String(Math.sin(p * Math.PI) * .9), transform: `translate(${pt.x}px, ${pt.y}px) scale(${lerp(.45, 1.15, easeOut(p))})` });
  return true;
}
let subKey = null;
function renderSubtitle(t) {
  const s = T.subtitles.find((x) => t >= x.from && t < x.to);
  if (!s) { $('sub').style.opacity = 0; return; }
  if (subKey !== s) { subKey = s; $('subBox').replaceChildren(...[s.text, s.em ? h('em', {}, s.em) : null, s.after || null].filter(Boolean)); }
  $('sub').style.opacity = vis(t, s.from, s.to, .15, .15);
}

function renderAt(t) {
  if (!geo) geo = geometry();

  /* Téléphone : présent en A (0–4), C–D (6.6–19.9), F (25.6–29.5) */
  const phoneVis = Math.max(vis(t, 0, 4.0, .6, .35), vis(t, 6.6, 19.9, .55, .4), vis(t, 25.6, 29.5, .55, .35));
  const phoneY = t < 5 ? lerp(70, 0, easeOut(prog(t, 0, .7))) : t < 22 ? lerp(70, 0, easeOut(prog(t, 6.6, .7))) : lerp(70, 0, easeOut(prog(t, 25.6, .7)));
  // Pendant l'achat, léger travelling avant sur le téléphone (le livret devient lisible).
  PUSH = easeInOut(prog(t, 12.9, .8)) * (1 - easeIn(prog(t, 19.4, .5)));
  set($('phone'), { opacity: phoneVis, transform: `translateY(${phoneY - 50 * PUSH}px) scale(${1 + .12 * PUSH})` });
  lock.style.opacity = t < 5 ? 1 : 0;
  wb.style.opacity = t >= 5 && t < 22 ? 1 : 0;
  hostLock.style.opacity = t >= 22 ? 1 : 0;

  /* A · écran verrouillé du voyageur, notification, tap */
  const nA = easeOut(prog(t, 1.2, .5));
  set(lock.querySelector('.notif'), { opacity: nA, transform: `translateY(${lerp(-30, 0, nA)}px)` });
  let tapping = tapAt(t, 3.2, geo.notif);

  /* B · la nuit chez l'hôte */
  const nv = vis(t, 3.9, 6.8, .45, .4);
  $('night').style.opacity = nv;
  $('night').firstElementChild.style.transform = `scale(${lerp(1.1, 1.03, prog(t, 3.9, 3))})`;

  /* C · livret : défilement jusqu'aux services */
  const sc = easeInOut(prog(t, 8.2, 3.0));
  wbContent.style.transform = `translateY(${-geo.scrollEnd * sc}px)`;
  status.style.color = geo.scrollEnd * sc > 260 ? '#2A241E' : '#FFF8F0';   // encre foncée hors de l'image d'en-tête
  $('linkChip').style.opacity = vis(t, 8.6, 13.3, .4, .3);
  $('linkChip').style.transform = `translateY(${lerp(-14, 0, easeOut(prog(t, 8.6, .4)))}px)`;
  titleIn(tCWords, t, 10.0);
  $('tC').style.opacity = 1 - easeIn(prog(t, 13.1, .35));

  /* D · extra « départ tardif » : réserver, payer, payé */
  const hl = easeOut(prog(t, 13.4, .4)) * (1 - easeIn(prog(t, SYNC.tapBook + .1, .3)));
  set(lateCard, { borderColor: `color-mix(in srgb, #BC5B36 ${Math.round(hl * 100)}%, #E8DCC8)`, transform: `translateY(${-5 * hl}px)`, boxShadow: `0 ${14 * hl}px ${30 * hl}px -14px rgba(74,52,32,.4)` });
  const mv = vis(t, 13.9, 19.8, .4, .4);
  set($('money'), { opacity: mv, transform: `translateY(${lerp(20, 0, easeOut(prog(t, 13.9, .4)))}px)` });
  moneyVal.textContent = String(Math.round(T.money.value * easeOut(prog(t, 14.2, 1.0))));
  tapping = tapAt(t, SYNC.tapBook, geo.book) || tapping;
  const sh = easeOut(prog(t, SYNC.tapBook + .15, .45)) * (1 - easeIn(prog(t, 19.3, .4)));
  sheet.style.transform = `translateY(${lerp(105, 0, sh)}%)`;
  $('dim').style.opacity = String(sh * (t < 22 ? 1 : 0));
  if (!payGeo && sh >= 1) payGeo = payPoint();
  if (payGeo) tapping = tapAt(t, SYNC.tapPay, payGeo) || tapping;
  payBtn.style.background = t >= SYNC.tapPay && t < SYNC.tapPay + .2 ? '#9E4527' : '';
  const done = t >= SYNC.tapPay + .45;
  sheetForm.style.display = done ? 'none' : 'block';
  sheetDone.style.display = done ? 'block' : 'none';
  const dp = easeOut(prog(t, SYNC.tapPay + .45, .4));
  set(sheetDone, { opacity: dp, transform: `translateY(${lerp(12, 0, dp)}px)` });
  set(paidChip, { opacity: easeOut(prog(t, SYNC.tapPay + .5, .35)) });
  if (!tapping) $('tap').style.opacity = 0;

  /* E · planning : la brique s'allonge ; photo du ménage : l'heure suit (11 h → 14 h) */
  const pv = vis(t, 19.9, 25.6, .6, .4);
  set($('plan'), { opacity: pv, transform: `translateY(${lerp(40, 0, easeOut(prog(t, 19.9, .7)))}px)` });
  barEls.forEach((el) => {
    const p = easeOut(prog(t, 20.2 + (+el.dataset.row) * .18, .6));
    const cut = lerp(100, 0, p);
    set(el, { opacity: p, clipPath: RTL ? `inset(-10px -10px -10px ${cut}%)` : `inset(-10px ${cut}% -10px -10px)`, transform: `translateX(${lerp(-24 * DIR, 0, p)}px)` });
  });
  now.style.opacity = easeOut(prog(t, 20.8, .4));
  lateBar.style.width = lerp(W11, W14, easeInOut(prog(t, SYNC.extend, .7))) + 'px';
  set($('callout'), { opacity: vis(t, SYNC.extend, 25.5, .35, .35), transform: `translateY(${lerp(12, 0, easeOut(prog(t, SYNC.extend, .4)))}px)` });
  // Le ménage suit la nouvelle heure de départ : photo + carte, l'heure passe de 11 h à 14 h.
  const cv = easeOut(prog(t, 20.6, .6)) * (1 - easeIn(prog(t, 25.3, .4)));
  set(clean, { opacity: cv, transform: `translateY(${lerp(40, 0, cv)}px)` });
  clean.firstElementChild.style.transform = `scale(${lerp(1.08, 1, easeOut(prog(t, 20.6, 5)))})`;
  const cc = easeOut(prog(t, 21.0, .5)) * (1 - easeIn(prog(t, 25.3, .4)));
  set(cleanCard, { opacity: cc, transform: `translateY(${lerp(24, 0, cc)}px)` });
  const rl = easeInOut(prog(t, SYNC.extend + .2, .5));
  set(rollOld, { transform: `translateY(${-110 * rl}%)`, opacity: 1 - rl });
  set(rollNew, { transform: `translateY(${110 * (1 - rl)}%)`, opacity: rl });
  autoChip.style.opacity = easeOut(prog(t, SYNC.extend + .7, .4));
  const tp = t < SYNC.extend ? .2 : lerp(.2, .6, easeOut(prog(t, SYNC.extend + .4, 1.2)));
  segs.forEach((sg, i) => sg.style.setProperty('--f', clamp(tp * 5 - i)));

  /* F · réveil de l'hôte : notification Baitly */
  const nF = easeOut(prog(t, 26.2, .5));
  set(hostLock.querySelector('.notif'), { opacity: nF, transform: `translateY(${lerp(-30, 0, nF)}px)` });
  titleIn(tFWords, t, 26.6);
  $('tF').style.opacity = 1 - easeIn(prog(t, 29.2, .35));

  /* G · logo + CTA */
  $('glow').style.opacity = easeOut(prog(t, 29.3, .8));
  const lIn = easeOut(prog(t, 29.5, .6));
  set($('logo'), { opacity: lIn, transform: `translateY(${lerp(24, 0, lIn)}px)` });
  set($('lTrait'), { strokeDasharray: '100 100', strokeDashoffset: String(100 - 100 * easeInOut(prog(t, 29.5, 1.0))) });
  const cyc = (((t - 30.5) % 5) + 5) % 5 / 5, pk = t >= 30.5;
  set($('lReq'), { opacity: pk && cyc < .5 ? 1 : 0, strokeDashoffset: String(-lerp(0, 94, cyc / .5)) });
  set($('lRes'), { opacity: pk && cyc >= .5 ? 1 : 0, strokeDashoffset: String(-lerp(94, 0, (cyc - .5) / .5)) });
  const cIn = easeOut(prog(t, 30.3, .6));
  set($('cta'), { opacity: cIn, transform: `translateY(${lerp(24, 0, cIn)}px)` });
  factEls.forEach((el, i) => { const p = easeOut(prog(t, 31.1 + i * .15, .5)); set(el, { opacity: p, transform: `translateY(${lerp(18, 0, p)}px)` }); });

  renderSubtitle(t);
}
window.renderAt = renderAt;
// Les positions dépendent des polices : on les recalcule une fois celles-ci chargées.
document.fonts.ready.then(() => { geo = null; payGeo = null; });
renderAt(0);

if (!window.__RENDER__) {
  const stage = $('stage');
  const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth / 1080, innerHeight / 1920)})`; };
  addEventListener('resize', fit); fit();
  let t0 = performance.now(), offset = 0, paused = false, cur = 0;
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') paused = !paused;
    if (e.code === 'ArrowRight') cur = Math.min(TL.duration, cur + 1);
    if (e.code === 'ArrowLeft') cur = Math.max(0, cur - 1);
    offset = cur; t0 = performance.now();
  });
  const loop = () => {
    cur = paused ? offset : (offset + (performance.now() - t0) / 1000) % TL.duration;
    renderAt(cur);
    $('hud').textContent = `${LANG} · ${cur.toFixed(2)} s${paused ? ' (pause)' : ''}`;
    requestAnimationFrame(loop);
  };
  loop();
}
</script>
</body>
</html>
