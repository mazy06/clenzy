<!doctype html>
<!--
  Baitly · Reel 14 « Le propriétaire inquiet » (Instagram, 1080 × 1920) · FR / EN

  À quoi sert ce fichier : l'animation de la relation propriétaire (BESOINS-ET-SERVICES.md §10),
  pilotée par le temps via le kit partagé ; les plans suivent la voix (slots recalés par align-vo.py).
  Composants réels repris : tuiles KPI (StatTile), carte HITL `OWNER_REVENUE_NOTE`, espace
  propriétaire (L25, relevés mensuels), récapitulatif de reversement (PayoutRecap) + `OWNER_PAYOUT`.
  Déroulé : revenus d'octobre −18 %, le propriétaire appelle → carte « Envoyer la note », clic →
  l'espace propriétaire, relevé d'octobre téléchargé, réponse du propriétaire → carte du reversement,
  clic « Approuver » → promesse → fin.
  Rendu : node ../render.mjs reel-14-proprietaire-inquiet --lang=fr
  À qui il s'adresse : motion designer / marketing, développeur.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Baitly · Reel 14 Le propriétaire inquiet</title>
<link rel="stylesheet" href="../shared/base.css">
<script src="timeline.js"></script>
<script src="i18n.js"></script>
<script src="../shared/kit.js"></script>
<style>
/* A · le mois en baisse, l'appel */
#kpiT { left: 80px; top: 390px; opacity: 0; }
#kpiT .eyebrow { display: inline-flex; align-items: center; gap: 10px; }
#kpi { left: 80px; width: 920px; top: 460px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.kt { padding: 26px 24px; opacity: 0; }
.kt small { display: block; font-size: 22px; color: var(--ardoise); font-weight: 600; }
.kt b { display: block; font-family: var(--fd); font-size: 44px; font-weight: 700; margin-top: 10px; direction: ltr; unicode-bidi: isolate; }
.kt .chip { margin-top: 14px; background: rgba(201,122,122,.14); color: #93413F; }
#own { left: 80px; width: 920px; top: 830px; padding: 28px 30px; display: flex; align-items: center; gap: 22px; opacity: 0; }
#own img { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; }
#own b { display: block; font-family: var(--fd); font-size: 36px; font-weight: 600; }
#own small { display: block; font-size: 23px; color: var(--ardoise); }
#own .cl { margin-inline-start: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
#own .cb { width: 96px; height: 96px; border-radius: 50%; background: #2F9E8D; color: #FDFDFE; display: flex; align-items: center; justify-content: center; }
#own .cl span { font-size: 21px; font-weight: 700; color: #0C7166; }
/* B · la note */
#c1 { left: 80px; top: 280px; opacity: 0; }
/* C · l'espace propriétaire (repère 390 px) */
.po { background: #F7FBFC; padding: 56px 16px 0; display: flex; flex-direction: column; gap: 10px; }
.po .hd { display: flex; align-items: center; gap: 8px; font-family: 'BSG', sans-serif; font-weight: 700; font-size: 20px; color: #1B2A35; }
.po .pp { font-size: 13px; color: #526674; margin-top: -6px; }
.po .sc { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #7A5230; margin-top: 8px; }
.po .ro { display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 14px; padding: 12px 12px; box-shadow: 0 1px 2px rgba(27,42,53,.08); font-size: 15px; }
.po .ro b { font-weight: 700; direction: ltr; unicode-bidi: isolate; }
.po .ro .m { flex: 1; color: #1B2A35; }
.po .ro .dl { width: 30px; height: 30px; border-radius: 9px; background: #E1E9F0; color: #25406E; display: flex; align-items: center; justify-content: center; }
.po .ro.hi { box-shadow: 0 0 0 2px #25406E; }
.po .sum { background: #1B2A35; color: #F7FBFC; border-radius: 16px; padding: 14px 16px; }
.po .sum small { display: block; font-size: 12px; color: #C5D9E5; font-weight: 600; }
.po .sum b { display: block; font-family: 'BSG', sans-serif; font-size: 30px; margin-top: 2px; direction: ltr; unicode-bidi: isolate; }
.po .bars { display: flex; align-items: flex-end; gap: 8px; height: 86px; margin-top: 10px; }
.po .bars i { flex: 1; border-radius: 6px 6px 0 0; background: rgba(197,217,229,.45); transform-origin: bottom; }
.po .bars i.cur { background: #E0C89B; }
.po .ro .ok { font-size: 11px; font-weight: 700; color: #0C7166; }
#reply { left: 600px; width: 420px; top: 780px; padding: 22px 24px; opacity: 0; }
#reply .rh { display: flex; align-items: center; gap: 12px; }
#reply .rh img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
#reply .rh b { font-size: 23px; } #reply .rh small { display: block; font-size: 19px; color: var(--ardoise); }
#reply p { margin-top: 14px; font-size: 24px; line-height: 1.45; }
/* D · le reversement */
#c2 { left: 80px; top: 420px; opacity: 0; }
#c2 .kv:last-child b { font-family: var(--fd); font-size: 32px; color: #0C7166; }
/* E · promesse */
#promise { left: 0; width: 1080px; top: 640px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
#promise .mi { width: 120px; height: 120px; border-radius: 40px; background: #E1E9F0; color: var(--n600); display: flex; align-items: center; justify-content: center; opacity: 0; }
#promise .title { font-size: 86px; opacity: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const K = BaitlyKit.init({ strings: STRINGS, timeline: TIMELINE });
const { T, SYNC, h, icon, set, prog, lerp, easeOut, easeIn, easeInOut, vis, slot, slotVis } = K;
const PH = '../../brand-book/assets/photos/';

/* A · les chiffres d'octobre, l'appel du propriétaire */
const kpiT = K.abs('kpiT');
kpiT.append(h('span', { class: 'eyebrow' }, icon('trenddown', 26), T.kpi.title));
const kpi = K.abs('kpi');
const tiles = T.kpi.tiles.map(([k, v, d]) => { const el = h('div', { class: 'kt card' }, h('small', {}, k), h('b', {}, v), h('span', { class: 'chip' }, icon('trenddown', 20), d)); kpi.append(el); return el; });
const O = T.owner;
const own = K.abs('own', 'card');
const callBtn = h('span', { class: 'cb' }, icon('call', 44));
const callTxt = h('span', {}, O.call);
own.append(h('img', { src: PH + 'host.jpg', alt: '' }), h('div', {}, h('b', {}, O.name), h('small', {}, O.role)), h('div', { class: 'cl' }, callBtn, callTxt));

/* B · la note de revenus (carte de l'agent Propriétaire) */
const N = T.note;
const c1 = K.hitlCard({ agent: N.agent, tag: N.tag, title: N.title, copy: N.copy, wait: N.wait, done: N.done,
  primary: ['send', N.send], secondary: ['pencil', N.edit], dismiss: N.dismiss, doneText: N.doneText });
c1.el.id = 'c1'; c1.el.classList.add('abs');
c1.body.append(h('div', { class: 'hg' }, N.grid.map(([k, v], i) => h('div', {}, h('small', {}, k), h('b', { class: i === 2 ? 'bad' : '' }, v)))),
  h('div', { class: 'hq', style: 'margin-top:16px' }, h('div', { class: 'hq-tag' }, icon('mail', 22), N.agent), h('div', {}, N.preview)));
K.stage.append(c1.el);

/* C · l'espace propriétaire, puis la réponse */
const P = T.portal;
const ph = K.phone({ left: 70, top: 260 });
const rows = P.months.map((m, i) => { const st = h('span', { class: 'ok' }); const dl = h('span', { class: 'dl' }, icon('filetext', 16)); return { el: h('div', { class: 'ro' + (i === 3 ? ' hi' : '') }, h('span', { class: 'm' }, m), h('b', {}, P.net[i]), st, dl), st, dl }; });
const bars = [0.92, 1, 0.8, 0.7].map((v, i) => h('i', { class: i === 3 ? 'cur' : '', style: `height:${v * 100}%` }));
const po = h('div', { class: 'layer po' }, h('div', { class: 'hd' }, icon('owner', 22), P.head), h('div', { class: 'pp' }, P.prop),
  h('div', { class: 'sum' }, h('small', {}, P.sumLabel), h('b', {}, P.net[3]), h('div', { class: 'bars' }, bars)), h('div', { class: 'sc' }, P.section), ...rows.map((r) => r.el), h('div', { class: 'home', style: 'background:rgba(27,42,53,.5)' }));
ph.scaler.append(po);
const reply = K.abs('reply', 'card');
reply.append(h('div', { class: 'rh' }, h('img', { src: PH + 'host.jpg', alt: '' }), h('div', {}, h('b', {}, O.name), h('small', {}, '09:12'))), h('p', {}, P.reply));

/* D · le reversement */
const R = T.payout;
const c2 = K.hitlCard({ agent: R.agent, tag: R.tag, title: R.title, wait: R.wait, done: R.done,
  primary: ['check', R.approve], secondary: ['filetext', R.statement], doneText: R.doneText });
c2.el.id = 'c2'; c2.el.classList.add('abs');
c2.body.append(h('div', {}, R.rows.map(([k, v]) => h('div', { class: 'kv' }, h('span', {}, k), h('b', {}, v)))));
K.stage.append(c2.el);

/* E · promesse puis fin */
const promise = K.abs('promise');
const mi = h('span', { class: 'mi' }, icon('owner', 60));
const p1 = h('div', { class: 'title' }, T.promise[0]), p2 = h('div', { class: 'title accent' }, T.promise[1]);
promise.append(mi, p1, p2);
K.endMount();

let pts = null;
function renderAt(t) {
  if (!pts) { const r = K.posIn(rows[3].dl, po); pts = { send: K.center(c1.pBtn), approve: K.center(c2.pBtn), dl: ph.toStage(r.x + 15, r.y + 15) }; }
  const [a0, b0] = slot(0), [a1, b1] = slot(1), [a2, b2] = slot(2), [a3, b3] = slot(3), [a4, b4] = slot(4);

  /* A */
  const v0 = slotVis(t, 0, .45, .4);
  const kt = easeOut(prog(t, a0, .5));
  set(kpiT, { opacity: v0 * kt, transform: `translateY(${lerp(14, 0, kt)}px)` });
  tiles.forEach((el, i) => { const p = easeOut(prog(t, a0 + .3 + i * .25, .5)); set(el, { opacity: v0 * p, transform: `translateY(${lerp(40, 0, p)}px)` }); });
  const oi = easeOut(prog(t, a0 + 1.2, .6));
  set(own, { opacity: v0 * oi, transform: `translateY(${lerp(40, 0, oi)}px)` });
  const ringing = t >= SYNC.ring;
  callTxt.style.opacity = ringing ? 1 : 0;
  const w = ringing ? (((t - SYNC.ring) % 1.2) / 1.2) : 0;
  callBtn.style.boxShadow = ringing ? `0 0 0 ${lerp(0, 26, w)}px rgba(47,158,141,${.45 * (1 - w)}), 0 0 0 ${lerp(0, 12, (w + .5) % 1)}px rgba(47,158,141,${.35 * (1 - ((w + .5) % 1))})` : 'none';
  callBtn.style.rotate = ringing ? `${Math.sin((t - SYNC.ring) * 30) * 6 * (w < .5 ? 1 : 0)}deg` : '0deg';

  /* B */
  const v1 = slotVis(t, 1), e1 = easeOut(prog(t, a1, .6));
  set(c1.el, { opacity: v1, transform: `translateY(${lerp(60, 0, e1)}px)` });
  c1.render(t, SYNC.send);
  K.cursorMove(t, SYNC.send - 1.2, .95, { x: pts.send.x + 320, y: pts.send.y + 360 }, pts.send, Math.min(SYNC.send + .9, b1));
  K.tapAt(t, SYNC.send, pts.send);

  /* C */
  const v2 = slotVis(t, 2), e2 = easeOut(prog(t, a2, .7));
  set(ph.el, { opacity: v2, transform: `translateY(${lerp(80, 0, e2)}px)` });
  bars.forEach((b, i) => { b.style.transform = `scaleY(${easeOut(prog(t, a2 + .3 + i * .1, .5))})`; });
  rows.forEach((r, i) => { const p = easeOut(prog(t, a2 + .4 + i * .15, .4)); set(r.el, { opacity: p, transform: `translateY(${lerp(10, 0, p)}px)` }); });
  K.handTap(t, SYNC.dl, pts.dl);
  const dld = t >= SYNC.dl + .2;
  if (rows[3].st.dataset.s !== String(dld)) { rows[3].st.dataset.s = String(dld); rows[3].st.textContent = dld ? P.sent : ''; }
  const rp = easeOut(prog(t, SYNC.reply, .5));
  set(reply, { opacity: v2 * rp, transform: `translateY(${lerp(30, 0, rp)}px)` });

  /* D */
  const v3 = slotVis(t, 3), e3 = easeOut(prog(t, a3, .6));
  set(c2.el, { opacity: v3, transform: `translateY(${lerp(60, 0, e3)}px)` });
  c2.render(t, SYNC.approve);
  K.cursorMove(t, SYNC.approve - 1.2, .95, { x: pts.approve.x + 320, y: pts.approve.y + 360 }, pts.approve, Math.min(SYNC.approve + .9, b3));
  K.tapAt(t, SYNC.approve, pts.approve);

  /* E */
  const v4 = slotVis(t, 4, .5, .35);
  const m = easeOut(prog(t, a4, .6));
  set(mi, { opacity: v4 * m, transform: `scale(${lerp(.8, 1, m)})` });
  const q1 = easeOut(prog(t, a4 + .1, .55)), q2 = easeOut(prog(t, a4 + (b4 - a4) * .55, .55));
  set(p1, { opacity: v4 * q1, transform: `translateY(${lerp(24, 0, q1)}px)` });
  set(p2, { opacity: v4 * q2, transform: `translateY(${lerp(24, 0, q2)}px)` });
  K.endRender(t, SYNC.end);
}
K.finalize(renderAt);
</script>
</body>
</html>
