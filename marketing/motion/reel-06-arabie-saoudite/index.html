<div id="stage"></div>
<script>
const K = BaitlyKit.init({ strings: STRINGS, timeline: TIMELINE });
const { T, SYNC, h, icon, set, prog, lerp, easeOut, easeIn, easeInOut, vis, words, titleIn } = K;
const PH = '../../brand-book/assets/photos/';
const BR = '../../brand-book/assets/brands/';
const SVGNS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs) => { const e = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
const title = (id, text, em) => { const el = K.abs(id, 'title ttl6'); return { el, ws: words(el, text, em) }; };

K.abs('illus').append(h('span', {}, T.illustrative));

/* Bandeau des canaux : plateformes saoudiennes en tête */
const OTA_FILES = {
  airbnb: ['airbnb-wordmark.png', 42], booking: ['booking-wordmark.png', 35], gathern: ['gathern-wordmark.webp', 31],
  mabeet: ['mabeet-wordmark.png', 48], expedia: ['expedia-wordmark.png', 38], agoda: ['agoda-wordmark.svg', 54],
};
const otas = K.abs('otas');
const otaTrack = h('div', { class: 'track' });
otas.append(h('div', { class: 'ey' }, T.otaTitle), h('div', { class: 'band' }, otaTrack));
for (let k = 0; k < 2; k++) T.otas.forEach((o) => { const [f, hgt] = OTA_FILES[o]; otaTrack.append(h('img', { src: BR + f, alt: '', style: `height:${hgt}px` })); });

/* A · « شموس ؟ » : le point d'interrogation arabe se dessine au trait */
const eyA = K.abs('eyA'); eyA.textContent = T.eyebrowA;
const tA = K.abs('tA', 'title');
const tAWord = h('span', {}, T.tA);
const qm = svgEl('svg', { viewBox: '0 0 100 140' });
const qg = svgEl('g', { transform: 'translate(100 0) scale(-1 1)' });   // « ? » en miroir = « ؟ »
const qPath = svgEl('path', { d: 'M20 40 C20 16 38 6 55 6 C76 6 88 20 88 38 C88 58 70 64 60 72 C52 79 52 86 52 98', fill: 'none', stroke: '#9A6C3A', 'stroke-width': 13, 'stroke-linecap': 'round', pathLength: 100 });
const qDot = svgEl('circle', { cx: 52, cy: 126, r: 9, fill: '#9A6C3A' });
qg.append(qPath, qDot); qm.append(qg);
tA.append(tAWord, qm);

/* A-B-G · photos : istiraha en arche, appartement parisien, Riyad en arche */
const arch = K.abs('arch', 'arch'); arch.append(h('img', { src: PH + 'pool.jpg', alt: '' }));
const paris = K.abs('paris', 'arch'); paris.append(h('img', { src: PH + 'guideLiving.webp', alt: '' }));
const lblR = K.abs('lblR', 'plabel'); lblR.append(h('span', {}, icon('pin', 28), h('b', {}, T.riyadh[0]), ' · ' + T.riyadh[1]));
const lblP = K.abs('lblP', 'plabel'); lblP.append(h('span', {}, icon('pin', 28), h('b', {}, T.paris[0]), ' · ' + T.paris[1]));
const tB = K.abs('tB', 'title ttl6');
tB.style.fontSize = '68px';
const tB1 = h('div', {}), tB2 = h('div', {});
tB.append(tB1, tB2);
const tB1w = words(tB1, T.tB1, T.tB1Em), tB2w = words(tB2, T.tB2, T.tB2Em);

/* C · enregistrement des voyageurs sur Shomoos */
const tC = title('tC', T.tC, T.tCEm);
const S = T.shomoos;
const shom = K.abs('shom', 'card');
const sendBtn = h('div', { id: 'send' }, icon('shield', 34), h('span', {}, S.btn));
const trows = S.rows.map((label) => {
  const chip = h('span', { class: 'chip wait' }, S.wait);
  const d = h('div', { class: 'd' }, S.detail);
  const el = h('div', { class: 'trow' }, h('div', { class: 'l' }, h('b', {}, label), chip), d);
  return { el, chip, d, done: false };
});
shom.append(
  h('div', { class: 'hd' }, h('span', { class: 'ic' }, icon('idcard', 34)), h('b', {}, S.title), h('span', { class: 'chip neutral' }, S.provider)),
  h('div', { class: 'res' }, h('img', { src: K.guestPhoto('omar'), alt: '' }), h('div', {}, h('b', {}, S.guest), h('span', {}, S.stay))),
  ...trows.map((r) => r.el), sendBtn);

/* D · facture : TVA 15 %, frais municipaux 5 %, QR ZATCA */
const tD = title('tD', T.tD, T.tDEm);
tD.el.style.fontSize = '68px';
const I = T.invoice;
const inv = K.abs('inv', 'card');
const amt = (v) => h('span', { class: 'amt' }, h('b', {}, v), h('small', {}, I.unit));
// QR illustratif : trois repères de position + motif déterministe (pas un vrai QR ZATCA).
const qrSvg = svgEl('svg', { viewBox: '0 0 25 25', 'shape-rendering': 'crispEdges' });
const finder = (x, y) => { qrSvg.append(svgEl('rect', { x, y, width: 7, height: 7, fill: '#1B2A35' }), svgEl('rect', { x: x + 1, y: y + 1, width: 5, height: 5, fill: '#fff' }), svgEl('rect', { x: x + 2, y: y + 2, width: 3, height: 3, fill: '#1B2A35' })); };
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
  const inFinder = (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16);
  if (!inFinder && rnd() < .48) qrSvg.append(svgEl('rect', { x, y, width: 1, height: 1, fill: '#1B2A35' }));
}
finder(0, 0); finder(18, 0); finder(0, 18);
const qr = h('div', { id: 'qr' }, qrSvg, h('small', {}, I.qr));
const invLines = I.lines.map(([lb, sub, v]) => h('div', { class: 'iline' }, h('div', { class: 'lb' }, h('b', {}, lb), h('span', {}, sub)), amt(v)));
const invTotal = h('div', { class: 'iline total' }, h('div', { class: 'lb' }, h('b', {}, I.total[0])), amt(I.total[1]));
const issued = h('span', { id: 'issued', class: 'chip ok' }, icon('check', 22), I.issued);
inv.append(
  h('div', { class: 'top' }, h('b', {}, I.title), h('span', { class: 'no' }, I.number), h('span', {}, I.date), h('span', {}, I.seller), qr),
  ...invLines, invTotal, issued);
const chipsD = K.abs('chipsD', 'chipsrow');
chipsD.style.top = '1230px';
const chipDEls = T.chipsD.map((c) => { const el = h('span', { class: 'chip' }, icon('check', 24), c); chipsD.append(el); return el; });

/* E · paiement en riyals : la fenêtre « Un séjour, un paiement » passe du Maroc à l'Arabie saoudite */
const tE = title('tE', T.tE, T.tEEm);
const P = T.pay;
const fin = K.productWindow({ title: P.title, icon: 'card', tabs: P.countries, active: 0 });
fin.el.id = 'fin';
K.stage.append(fin.el);
const amt6 = (v) => { const b = h('b', {}, v); const u = h('small', {}, ''); return { el: h('span', { class: 'amt6' }, b, u), b, u }; };
const nightA = amt6(''), totalA = amt6('');
const prov = h('span', { class: 'prov' });
const goLbl = h('span', {}, '');
const goPg = h('i', { class: 'pg' });
const go = h('div', { class: 'go6' }, goPg, icon('card', 28), goLbl);
const okp = h('div', { class: 'okp' }, icon('check', 34), h('div', {}, h('b', {}, P.done), h('span', {}, P.receipt)));
const stepEls = P.steps.map((x) => h('span', { class: 'st' }, h('i', {}, icon('check', 18)), x));
const lnEls = [h('i'), h('i')];
fin.body.append(
  h('div', { class: 'bk' }, h('img', { src: PH + 'pool.jpg', alt: '' }), h('div', {}, h('b', {}, P.name), h('span', {}, P.stay)), h('span', { class: 'ref' }, P.ref)),
  h('div', { class: 'fl' }, h('span', {}, P.nightly), nightA.el),
  h('div', { class: 'fl big' }, h('span', {}, P.total), totalA.el),
  h('div', { class: 'fl' }, h('span', {}, P.method), prov),
  go, okp,
  h('div', { class: 'steps6' }, stepEls[0], h('span', { class: 'ln' }, lnEls[0]), stepEls[1], h('span', { class: 'ln' }, lnEls[1]), stepEls[2]));
const fmt = (v) => Math.round(v).toLocaleString('en-US');
let finMarket = null;
function setMarket(sa) {
  if (finMarket === sa) return;
  finMarket = sa;
  const M = sa ? P.sa : P.ma;
  nightA.u.textContent = M.unit; totalA.u.textContent = M.unit; goLbl.textContent = M.cta;
  prov.replaceChildren(sa ? h('span', { class: 'ptabs' }, M.name) : h('img', { src: BR + M.logo, alt: '' }),
    sa ? h('span', { class: 'also' }, P.also, h('img', { src: BR + 'stripe.svg', alt: '' })) : '');
  fin.setTab(sa ? 1 : 0);
}
let finPts = null;

/* F · planning : une interface pensée à gauche bascule à droite, puis passe à l'hégirien */
const tF = title('tF', T.tF, T.tFEm);
const ROWS = [
  [{ status: 'confirmed', from: [0, 15], to: [3, 11], guest: 'omar', av: true, nights: 3, price: true },
   { status: 'pending', from: [3, 15], to: [5, 11], guest: 'sara', av: true, nights: 2 }],
  [{ status: 'checked_in', from: [0, 1], to: [2, 11], guest: 'jad', av: true, nights: 3, wrench: true }, { blocked: true, from: 3, to: 5 }],
  [{ orphan: 'broom', day: 0 }, { status: 'confirmed', from: [1, 15], to: [4, 11], guest: 'nadia', av: true, nights: 3, combo: 1 }],
  [{ status: 'confirmed', from: [0, 15], to: [2, 11], guest: 'karim', av: true, nights: 2, logo: 'airbnb' }, { orphan: 'wrench', day: 3 }],
];
const planL = K.abs('planL', 'plan6'); planL.dir = 'ltr';
const planR = K.abs('planR', 'plan6');
const plL = K.planning(planL, { P: T.planEn, dw: 145, days: T.planEn.days, today: 0, weekend: T.planEn.weekend, rows: ROWS });
const plR = K.planning(planR, { P: T.plan, dw: 145, days: T.plan.days, today: 0, weekend: T.plan.weekend, rows: ROWS });
// En-tête arabe : quantième grégorien puis hégirien (même journée civile), date grégorienne en petit.
const hjDays = [...planR.querySelectorAll('.pday')].map((d, i) => {
  const b = d.querySelector('b');
  const g = h('span', { class: 'g' }, b.textContent);
  const hj = h('span', { class: 'hj' }, String(T.hijri.days[i]));
  b.replaceChildren(g, hj);
  const gs = h('small', { class: 'gs' }, T.hijri.greg[i]);
  d.append(gs);
  return { g, hj, gs };
});
const cornerR = planR.querySelector('.ph .pcol small');
// Les feuilles des deux plannings, dans le même ordre : décalage physique LTR → RTL.
const LEAVES = '.pcol, .pday, .bar, .blocked, .orphan, .now';
let flipDx = null;
function measureFlip() {
  const l = [...planL.querySelectorAll(LEAVES)], r = [...planR.querySelectorAll(LEAVES)];
  flipDx = l.map((el, i) => ({ el, dx: K.posIn(r[i], K.stage).x - K.posIn(el, K.stage).x }));
}
const chipsF = K.abs('chipsF', 'chipsrow');
chipsF.style.top = '1110px';
const chipFEls = T.chipsF.map((c) => { const el = h('span', { class: 'chip' }, icon('check', 24), c); chipsF.append(el); return el; });

/* G · promesse sur Riyad, puis fin */
const riyadh = K.abs('riyadh', 'arch'); riyadh.append(h('img', { src: PH + 'homeLocal.webp', alt: '' }));
const promise = K.abs('promise', 'title');
const pA = h('div', {}, T.promise[0]), pB = h('div', { class: 'accent' }, T.promise[1]);
promise.append(pA, pB);
K.endMount();

/** Place un bloc (left, top, largeur, hauteur) ; l'arche garde un demi-cercle en haut. */
function box(el, r, archTop = true) {
  set(el, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
  if (archTop) el.style.borderRadius = `${r.w / 2}px ${r.w / 2}px 36px 36px`;
}
const mix = (a, b, p) => ({ x: lerp(a.x, b.x, p), y: lerp(a.y, b.y, p), w: lerp(a.w, b.w, p), h: lerp(a.h, b.h, p) });
const ARCH_A = { x: 190, y: 680, w: 700, h: 800 }, ARCH_B = { x: 560, y: 610, w: 440, h: 690 }, ARCH_C = { x: 80, y: 610, w: 920, h: 690 };
const PARIS = { x: 80, y: 610, w: 440, h: 690 };
let sendPt = null;

function renderAt(t) {
  const otaVis = Math.max(vis(t, 3.7, 9.0, .5, .4), vis(t, 39.6, SYNC.end - .1, .5, .3));
  set(otas, { opacity: otaVis, transform: `translateY(${lerp(-16, 0, otaVis)}px)` });
  otaTrack.style.transform = `translateX(${(t * 42) % (otaTrack.scrollWidth / 2 + 42)}px)`;
  $illus(t);

  /* A · شموس ؟ */
  const aOut = easeIn(prog(t, 3.3, .35));
  const eIn = easeOut(prog(t, .2, .5));
  set(eyA, { opacity: eIn * (1 - aOut), transform: `translateY(${lerp(16, 0, eIn)}px)` });
  const wIn = easeOut(prog(t, .35, .55));
  set(tAWord, { display: 'inline-block', opacity: wIn, transform: `translateY(${lerp(26, 0, wIn)}px)` });
  set(qPath, { strokeDasharray: '100 100', strokeDashoffset: String(100 - 100 * easeInOut(prog(t, .8, .8))) });
  qDot.style.opacity = easeOut(prog(t, 1.55, .2));
  tA.style.opacity = 1 - aOut;

  /* A → B → C · l'arche de l'istiraha ; Paris entre puis sort du cadre */
  const toB = easeInOut(prog(t, 3.45, .7)), toC = easeInOut(prog(t, SYNC.parisOut, .7));
  box(arch, toC > 0 ? mix(ARCH_B, ARCH_C, toC) : mix(ARCH_A, ARCH_B, toB));
  const archIn = easeOut(prog(t, .1, .7));
  const bOut = easeIn(prog(t, 9.0, .4));
  set(arch, { opacity: archIn * (1 - bOut) });
  arch.firstChild.style.transform = `scale(${lerp(1.12, 1, easeOut(prog(t, 0, 4)))})`;
  const pIn = easeOut(prog(t, 3.6, .7));
  box(paris, PARIS, false);
  set(paris, { opacity: pIn * (1 - easeIn(prog(t, SYNC.parisOut, .5))), transform: `translateX(${lerp(-560, 0, pIn) - 620 * easeIn(prog(t, SYNC.parisOut, .6))}px)` });
  const lIn = easeOut(prog(t, 4.2, .5));
  const rL = toC > 0 ? mix(ARCH_B, ARCH_C, toC) : ARCH_B;
  set(lblR, { left: rL.x + 'px', width: rL.w + 'px', top: rL.y + rL.h + 24 + 'px', opacity: lIn * (1 - bOut) });
  set(lblP, { left: PARIS.x + 'px', width: PARIS.w + 'px', top: PARIS.y + PARIS.h + 24 + 'px', opacity: lIn * (1 - easeIn(prog(t, SYNC.parisOut, .35))) });
  titleIn(tB1w, t, 3.7);
  titleIn(tB2w, t, SYNC.parisOut + .1);
  tB.style.opacity = 1 - bOut;

  /* C · Shomoos : trois fiches passent « تم الإرسال » */
  const cV = vis(t, 9.3, 16.9, .5, .4);
  titleIn(tC.ws, t, 9.4); tC.el.style.opacity = 1 - easeIn(prog(t, 16.6, .35));
  set(shom, { opacity: cV, transform: `translateY(${lerp(50, 0, easeOut(prog(t, 9.4, .6)))}px)` });
  if (!sendPt) { const p = K.posIn(sendBtn, K.stage); sendPt = { x: p.x + sendBtn.offsetWidth / 2, y: p.y + sendBtn.offsetHeight / 2 }; }
  K.tapAt(t, SYNC.submit, sendPt);
  const sent = t >= SYNC.submit + .25;
  sendBtn.className = sent ? 'done' : '';
  sendBtn.replaceChildren(icon(sent ? 'check' : 'shield', 34), h('span', {}, sent ? S.btnDone : S.btn));
  sendBtn.style.transform = `scale(${1 - .03 * Math.sin(Math.PI * prog(t, SYNC.submit, .25))})`;
  trows.forEach((r, i) => {
    const t0 = SYNC.submit + .5 + i * .35, done = t >= t0;
    if (done !== r.done) { r.done = done; r.chip.className = 'chip ' + (done ? 'ok' : 'wait'); r.chip.replaceChildren(...(done ? [icon('check', 22), S.done] : [S.wait])); }
    const dp = easeOut(prog(t, t0, .4));
    set(r.d, { height: 30 * dp + 'px', opacity: dp });
  });

  /* D · la facture se compose ligne par ligne */
  const dV = vis(t, 17.0, 25.1, .5, .4);
  titleIn(tD.ws, t, 17.2); tD.el.style.opacity = 1 - easeIn(prog(t, 24.8, .35));
  set(inv, { opacity: dV, transform: `translateY(${lerp(50, 0, easeOut(prog(t, 17.1, .6)))}px)` });
  [...invLines, invTotal].forEach((el, i) => { const p = easeOut(prog(t, SYNC.lines[i], .5)); set(el, { opacity: p, transform: `translateY(${lerp(18, 0, p)}px)` }); });
  const q = easeOut(prog(t, SYNC.qr, .5));
  set(qr, { opacity: q, transform: `scale(${lerp(.85, 1, q)})` });
  const is = easeOut(prog(t, SYNC.qr + .5, .45));
  set(issued, { opacity: is, transform: `translateY(${lerp(12, 0, is)}px)` });
  [SYNC.lines[1], SYNC.lines[2], SYNC.qr].forEach((t0, i) => { const p = easeOut(prog(t, t0 + .2, .45)) * (1 - easeIn(prog(t, 24.8, .35))); set(chipDEls[i], { opacity: p, transform: `translateY(${lerp(16, 0, p)}px)` }); });

  /* E · paiement en riyals : onglet « السعودية », puis encaissement et rapprochement */
  titleIn(tE.ws, t, 25.4); tE.el.style.opacity = 1 - easeIn(prog(t, 30.9, .35));
  const eV = vis(t, 25.3, 31.2, .6, .4);
  set(fin.el, { opacity: eV, transform: `translateY(${lerp(50, 0, easeOut(prog(t, 25.3, .6)))}px)` });
  if (!finPts) { const c = (el) => { const p = K.posIn(el, K.stage); return { x: p.x + el.offsetWidth / 2, y: p.y + el.offsetHeight / 2 }; }; finPts = { tab: c(fin.tabEls[1]), go: c(go) }; }
  const TAB = 26.1;
  setMarket(t >= TAB);
  const mp = easeInOut(prog(t, TAB, .6));
  nightA.b.textContent = fmt(t < TAB ? P.ma.nightly : lerp(P.ma.nightly, P.sa.nightly, mp));
  totalA.b.textContent = fmt(t < TAB ? P.ma.total : lerp(P.ma.total, P.sa.total, mp));
  if (t < TAB - .1) K.cursorMove(t, 25.2, .8, { x: finPts.tab.x - 200, y: finPts.tab.y + 260 }, finPts.tab, SYNC.pay + .7);
  else K.cursorMove(t, 27.0, .8, finPts.tab, finPts.go, SYNC.pay + .7);
  K.tapAt(t, TAB - .1, finPts.tab);
  K.tapAt(t, SYNC.pay, finPts.go);
  const pgp = easeInOut(prog(t, SYNC.pay + .1, .8));
  goPg.style.width = pgp * 100 + '%';
  const paid = t >= SYNC.pay + .95;
  go.style.display = paid ? 'none' : 'flex';
  okp.style.display = paid ? 'flex' : 'none';
  okp.style.opacity = easeOut(prog(t, SYNC.pay + .95, .35));
  const ST = [25.3, SYNC.pay + .9, SYNC.pay + 1.5];
  stepEls.forEach((el, i) => el.classList.toggle('on', t >= ST[i]));
  lnEls.forEach((el, i) => { el.style.width = easeOut(prog(t, ST[i + 1] - .45, .45)) * 100 + '%'; });

  /* F · bascule de mise en page (LTR → RTL), puis calendrier hégirien */
  titleIn(tF.ws, t, 31.6); tF.el.style.opacity = 1 - easeIn(prog(t, 38.9, .35));
  if (!flipDx) measureFlip();
  const fIn = easeOut(prog(t, 31.4, .7)), fOut = easeIn(prog(t, 39.0, .4));
  const fp = easeInOut(prog(t, SYNC.flip, .9));
  const swap = easeOut(prog(t, SYNC.flip + .8, .35));
  set(planL, { opacity: fIn * (1 - swap) * (1 - fOut), transform: `translateY(${lerp(40, 0, fIn)}px)` });
  set(planR, { opacity: swap * (1 - fOut) });
  flipDx.forEach(({ el, dx }) => { el.style.transform = `translateX(${dx * fp}px)`; });
  plL.bars.forEach((el) => {
    const p = easeOut(prog(t, 31.7 + (+el.dataset.row) * .15, .55));
    set(el, { opacity: p, clipPath: `inset(-10px ${lerp(100, 0, p)}% -10px -10px)` });
  });
  if (plL.now) plL.now.style.opacity = easeOut(prog(t, 32.2, .4));
  if (plR.now) plR.now.style.opacity = 1;
  const hp = easeInOut(prog(t, SYNC.hijri, .6));
  hjDays.forEach(({ g, hj, gs }, i) => {
    const p = easeInOut(prog(t, SYNC.hijri + i * .08, .5));
    set(g, { opacity: 1 - p, transform: `translateY(${-14 * p}px)` });
    set(hj, { opacity: p, transform: `translateY(${14 * (1 - p)}px)` });
    set(gs, { opacity: p, height: 20 * p + 'px' });
  });
  cornerR.textContent = hp > .5 ? T.hijri.month : T.plan.corner;
  cornerR.style.opacity = String(Math.abs(hp - .5) * 2);
  [SYNC.flip - .9, SYNC.flip + .3, SYNC.hijri].forEach((t0, i) => { const p = easeOut(prog(t, t0, .45)) * (1 - fOut); set(chipFEls[i], { opacity: p, transform: `translateY(${lerp(16, 0, p)}px)` }); });

  /* G · « على دراية بمهنتك. وبواقعك. » sur Riyad, puis fin */
  const gOut = easeIn(prog(t, SYNC.end - .3, .4));
  const rIn = easeOut(prog(t, 39.4, .7));
  box(riyadh, { x: 190, y: 640, w: 700, h: 780 });
  set(riyadh, { opacity: rIn * (1 - gOut) });
  riyadh.firstChild.style.transform = `scale(${lerp(1.1, 1, easeOut(prog(t, 39.4, 4)))})`;
  const q1 = easeOut(prog(t, 39.6, .55)), q2 = easeOut(prog(t, 40.6, .55));
  set(pA, { opacity: q1 * (1 - gOut), transform: `translateY(${lerp(20, 0, q1)}px)` });
  set(pB, { opacity: q2 * (1 - gOut), transform: `translateY(${lerp(20, 0, q2)}px)` });
  K.endRender(t, SYNC.end);
}
const illusEl = document.getElementById('illus');
function $illus(t) { illusEl.style.opacity = vis(t, 9.4, 39.0, .4, .4) * .95; }
K.finalize(renderAt, () => { flipDx = null; sendPt = null; finPts = null; });
</script>
</body>
