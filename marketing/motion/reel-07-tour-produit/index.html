  /* Intro */
  wordEls.forEach((el, i) => {
    const pIn = easeOut(prog(t, .2 + i * .22, .5));
    const conv = easeInOut(prog(t, 2.9 + i * .05, .8));
    const c0 = center(el);
    set(el, { opacity: pIn * (1 - conv), transform: `translate(${(960 - c0.x) * conv}px, ${(540 - c0.y) * conv}px) scale(${lerp(1, .3, conv)})` });
  });
  set(introHouse.trait, { strokeDasharray: '100 100', strokeDashoffset: String(100 - 100 * easeInOut(prog(t, 3.3, 1.0))) });
  set(introHouse.pk, { opacity: t > 4.3 ? 1 : 0, strokeDashoffset: String(-94 * prog(t, 4.3, 1.2)) });

  /* 01 */
  K.planningEnter(t, 5.4, pl1);
  const d = prog(t, SYNC.drop, .55);
  const bounce = d < .7 ? lerp(-60, 8, easeOut(d / .7)) : lerp(8, 0, easeOut((d - .7) / .3));
  set(newBar, { opacity: easeOut(prog(t, SYNC.drop, .2)), transform: `translateY(${bounce}px)`, clipPath: 'none' });
  const fl = easeOut(prog(t, 6.0, .6));
  set(flow1, { opacity: fl, transform: `translateX(${lerp(40 * DIR, 0, fl)}px)` });
  const RECV = SYNC.drop + .8, DIFF = RECV + .5;
  const rowY = (i) => crows[i].el.offsetTop + 32;
  if (t > SYNC.drop && t < RECV) { const p = easeInOut(prog(t, SYNC.drop, .8)); set(pk1, { opacity: 1, top: lerp(rowY(0), -30, p) + 'px', background: '#C5E0ED' }); }
  else if (t > DIFF && t < DIFF + .9) { const p = easeInOut(prog(t, DIFF, .9)); set(pk1, { opacity: 1, top: lerp(-30, rowY(3), p) + 'px', background: '#E0C89B' }); }
  else pk1.style.opacity = 0;
  const flash = t > RECV && t < RECV + .6 ? 1 - Math.abs((t - RECV - .3) / .3) : 0;
  hub1.style.borderColor = `color-mix(in srgb, #E0C89B ${Math.round(flash * 100)}%, #4F6B80)`;
  crows.forEach((cr, i) => {
    if (i === 0) chip1(cr, t >= SYNC.drop ? 'booked' : 'open');
    else chip1(cr, t >= DIFF + .3 * i ? 'closed' : 'open');
  });
  st1.style.opacity = easeOut(prog(t, DIFF + 1.1, .4));

  /* 02 */
  set(site, { opacity: easeOut(prog(t, 15.2, .5)) });
  blocks.forEach((b, i) => { const p = easeOut(prog(t, 15.7 + i * .8, .55)); set(b, { opacity: p, transform: `translateY(${lerp(30, 0, p)}px)` }); });
  const zp = easeOut(prog(t, 19.6, .6));
  set(zero, { opacity: zp, transform: `translateY(${lerp(24, 0, zp)}px)` });
  K.handTap(t, 20.3, pts.book);
  stepEls.forEach((s, i) => s.classList.toggle('on', t >= 20.5 + i * .55));

  /* 03 */
  set(rev.el, { opacity: easeOut(prog(t, 24.2, .5)) });
  const vals = base.map((v, i) => (LOW.includes(i) ? lerp(v, R.to, easeInOut(prog(t, SYNC.approve + .3, .9))) : v));
  drawCurve(vals);
  set(line, { strokeDasharray: '100 100', strokeDashoffset: String(100 - 100 * easeInOut(prog(t, 24.6, 1.2))) });
  dots.forEach((dd, i) => { dd.style.opacity = easeOut(prog(t, 24.8 + i * .07, .3)); });
  band.style.opacity = easeOut(prog(t, 26.2, .5));
  const hp = easeOut(prog(t, 26.6, .6));
  set(hitl, { opacity: hp, transform: `translateY(${lerp(30, 0, hp)}px)` });
  const ok = t >= SYNC.approve + .1;
  if (goBtn.dataset.s !== String(ok)) {
    goBtn.dataset.s = ok; goBtn.className = 'go' + (ok ? ' done' : ''); goBtn.replaceChildren(icon('check', 26), ok ? R.ok : R.approve);
    hChip.className = 'chip ' + (ok ? 'ok' : 'wait'); hChip.replaceChildren(...(ok ? [icon('check', 18), R.ok] : [R.wait]));
  }
  K.cursorMove(t, SYNC.approve - 1.1, .9, { x: pts.go.x - 260 * DIR, y: pts.go.y - 220 }, pts.go, SYNC.approve + .8);
  K.tapAt(t, SYNC.approve, pts.go);
  const tp = easeOut(prog(t, 28.8, .6));
  set(team, { opacity: tp, transform: `translateY(${lerp(20, 0, tp)}px)` });

  /* 04 */
  const pp = easeOut(prog(t, 34.2, .6));
  set(ph.el, { opacity: pp, transform: `translateY(${lerp(40, 0, pp)}px) scale(.7)` });
  offerEls.forEach((el, i) => { const p = easeOut(prog(t, 36.0 + i * .35, .55)); set(el, { opacity: p, transform: `translateX(${lerp(60 * DIR, 0, p)}px)` }); });
  K.handTap(t, SYNC.add, pts.add);
  const added = t >= SYNC.add + .1;
  if (addBtns[1].dataset.s !== String(added)) { addBtns[1].dataset.s = added; addBtns[1].className = 'ad' + (added ? ' on' : ''); addBtns[1].replaceChildren(...(added ? [icon('check', 18), G.added] : [G.add])); }
  set(sel, { opacity: easeOut(prog(t, 37.4, .5)) });
  selChip.style.opacity = easeOut(prog(t, SYNC.add + .2, .35));
  selTotal.textContent = fmt(chefPrice * easeOut(prog(t, SYNC.add + .2, .7)));

  /* 05 */
  const N5 = [43.6, 44.8, 45.9, 47.2, 48.8];
  nodes.forEach((n, i) => n.classList.toggle('on', t >= N5[i]));
  lines.forEach((l, i) => { l.style.width = easeOut(prog(t, N5[i + 1] - .5, .5)) * 100 + '%'; });
  set(chain, { opacity: easeOut(prog(t, 43.3, .4)) });
  const ck = easeOut(prog(t, 44.6, .5));
  set(chk, { opacity: ck, transform: `translateY(${lerp(30, 0, ck)}px)` });
  const TK = [45.4, 46.2, 47.0];
  tasks.forEach((tk, i) => tk.classList.toggle('on', t >= TK[i]));
  chkCount.textContent = `${TK.filter((x) => t >= x).length} / 3`;
  const ready = t >= TK[2], done5 = t >= SYNC.proof + .1;
  chkBtn.className = 'go' + (done5 ? ' done' : ready ? ' on' : '');
  if (chkBtn.dataset.s !== String(done5)) { chkBtn.dataset.s = done5; chkBtn.replaceChildren(icon('check', 24), done5 ? O.done : O.action); }
  K.cursorMove(t, SYNC.proof - 1.0, .8, { x: pts.chk.x + 200 * DIR, y: pts.chk.y + 160 }, pts.chk, SYNC.proof + .7);
  K.tapAt(t, SYNC.proof, pts.chk);
  const pf = easeOut(prog(t, 45.0, .6));
  set(proof.el, { opacity: pf, transform: `translateY(${lerp(30, 0, pf)}px)` });
  proof.img.style.transform = `scale(${lerp(1.08, 1, easeOut(prog(t, 45.0, 5)))})`;
  set(ver, { opacity: easeOut(prog(t, SYNC.proof + .2, .4)) });
  const po = easeOut(prog(t, 48.8, .5));
  set(payout, { opacity: po, transform: `translateY(${lerp(30, 0, po)}px)` });
  payTrack.set(easeOut(prog(t, 49.0, 1.4)));

  /* 06 */
  lgs.forEach((l, i) => { const p = easeOut(prog(t, 52.6 + i * .2, .45)); set(l, { opacity: p, transform: `translateY(${lerp(18, 0, p)}px)` }); });
  set(pay6, { opacity: 1 });
  const iv = easeOut(prog(t, 53.4, .5));
  set(pay6.querySelector('#inv7'), { opacity: iv, transform: `translateY(${lerp(24, 0, iv)}px)` });
  [...invLines, invTot].forEach((el, i) => { el.style.opacity = easeOut(prog(t, 53.9 + i * .45, .4)); });
  invChips.forEach((el, i) => { el.style.opacity = easeOut(prog(t, 55.4 + i * .3, .4)); });
  const sp = easeOut(prog(t, 54.8, .6));
  set(st7, { opacity: sp, transform: `translateY(${lerp(24, 0, sp)}px)` });
  stLines.forEach((el, i) => { el.style.opacity = easeOut(prog(t, SYNC.statement - 1.2 + i * .35, .4)); });
  netV.textContent = fmt(ST.values[3] * easeOut(prog(t, SYNC.statement, 1.0)));
  stSent.style.opacity = easeOut(prog(t, SYNC.statement + 1.3, .4));

  /* 07 : bascules de langue (miroir quand le sens de lecture change) */
  const o = T.langs.order;
  const [f1, f2] = SYNC.flips;
  flips.forEach((Fx) => Fx.leaves.forEach(({ el }) => { el.style.transform = ''; }));
  const enter = easeOut(prog(t, 61.3, .6));
  K.planningEnter(t, 61.5, pl7[o[0]].pl);
  [o[1], o[2]].forEach((lg) => { pl7[lg].pl.bars.forEach((b) => set(b, { opacity: 1, clipPath: 'none' })); if (pl7[lg].pl.now) pl7[lg].pl.now.style.opacity = 1; });
  const fk = t < f2 - .05 ? 0 : 1, F7 = flips[fk], ft = SYNC.flips[fk];
  const fp = easeInOut(prog(t, ft, .9)), sw = easeOut(prog(t, ft + .8, .35));
  if (F7.mirror) F7.leaves.forEach(({ el, dx }) => { el.style.transform = `translateX(${dx * fp}px)`; });
  const op = fk === 0 ? [enter * (1 - sw), sw, 0] : [0, 1 - sw, sw];
  o.forEach((lg, i) => { pl7[lg].box.style.opacity = op[i]; });
  ctrEls.forEach((el, i) => { const p = easeOut(prog(t, 63.9 + i * .85, .45)); set(el, { opacity: p, transform: `translateY(${lerp(16, 0, p)}px)` }); });

  /* Fin */
  K.endRender(t, CH[7] + .6);
  titleIn(e1w, t, CH[7] + 1.2);
  titleIn(e2w, t, CH[7] + 1.9);
}
K.finalize(renderAt, () => { pts = null; flips = null; });
</script>
</body>
</html>
