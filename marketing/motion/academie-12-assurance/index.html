<!doctype html>
<!--
  Baitly Académie · Épisode 12 « Votre assurance couvre-t-elle la location courte durée ? » (≈ 2 min) · 9:16 et
  16:9, depuis le même fichier. Voix : Noé (les épisodes alternent voix féminine et masculine).

  À quoi sert ce fichier : l'animation de l'épisode, pilotée par le temps via le kit des Reels et les
  composants de la série (../academie-shared/academie.js) ; les plans suivent la voix (align-vo.py).
  Information générale : des questions à poser à son assureur, aucune règle de droit affirmée.
  Chapitres : 0 accroche (dégât des eaux, qui paie ?) → 1 votre contrat → 2 les six questions (piège : la
  garantie de la plateforme) → 3 les chiffres (300 € ou 1 200 €) → 4 les preuves et la mise en pratique →
  5 à retenir → fin.
  Photos : ../academie-shared/photos/SOURCES.md (<img>, pour que le rendu attende leur chargement).
  Rendu : node ../render.mjs academie-12-assurance --format=9x16   (puis --format=16x9)
  À qui il s'adresse : motion designer / marketing, développeur.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Baitly Académie · 12 L'assurance de la location courte durée</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../academie-shared/academie.css">
<script src="timeline.js"></script>
<script src="i18n.js"></script>
<script src="../shared/kit.js"></script>
<script src="../academie-shared/academie.js"></script>
<style>
/* Préfixe as- : aucune collision avec base.css (.bar, .chip, .row, .card, .ph… y sont déjà pris). */
.q { font-family: var(--fd); font-weight: 700; letter-spacing: -.025em; line-height: 1.04; }
.asfill { flex: 1; position: relative; min-height: 0; }
.aslayer { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 18px; opacity: 0; }
.asimg { display: block; object-fit: cover; }
.aspill { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; padding: 12px 20px; font-size: 25px; font-weight: 700; opacity: 0; }
.aspill.ok { background: rgba(13,148,136,.12); color: var(--ok); }
.aspill.warn { background: #B45733; color: #FDFDFE; }
.aspill.soft { background: #F4EBDC; color: var(--encre-terre); }

/* 0 · accroche */
.ashook { padding: 26px; display: flex; flex-direction: column; gap: 14px; opacity: 0; }
.ashook .asimg { width: 100%; height: 300px; border-radius: 24px; opacity: 0; }
.asev { display: flex; align-items: center; gap: 16px; background: var(--surface); border-radius: 20px; padding: 12px 18px 12px 12px; opacity: 0; }
.asev i { flex: none; width: 56px; height: 56px; border-radius: 16px; background: #F7E4DC; color: #B45733; display: flex; align-items: center; justify-content: center; }
.asev div { flex: 1; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.asev span { font-size: 23px; font-weight: 700; color: var(--gris); font-variant-numeric: tabular-nums; }
.asev b { font-size: 28px; font-weight: 700; color: var(--n700); }
.aswho { display: flex; align-items: center; gap: 12px; background: var(--n600); color: var(--papier); border-radius: 20px; padding: 16px 20px; font-size: 26px; font-weight: 700; opacity: 0; }

/* 1 · votre contrat */
.astiles { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.astile { display: flex; flex-direction: column; gap: 12px; background: var(--surface); border-radius: 26px; padding: 26px 22px; min-height: 250px; opacity: 0; }
.astile i { width: 76px; height: 76px; border-radius: 22px; background: var(--n600); color: var(--papier); display: flex; align-items: center; justify-content: center; }
.astile b { font-family: var(--fd); font-size: 34px; font-weight: 700; color: var(--n700); line-height: 1.1; }
.astile span { font-size: 25px; font-weight: 600; color: var(--ardoise); }
.astile.stay i { background: var(--terre); }
.asneq { font-family: var(--fd); font-size: 70px; font-weight: 700; color: #B45733; opacity: 0; }
.assteps { display: flex; flex-direction: column; gap: 10px; }
.assteps span { display: flex; align-items: center; gap: 14px; background: #FDFDFE; border: 1.5px solid var(--ligne2); border-radius: 18px; padding: 14px 20px; font-size: 26px; font-weight: 700; color: var(--n700); opacity: 0; }
.assteps span svg { color: var(--ok); flex: none; }

/* 2 · les six questions */
.asqs { display: flex; flex-direction: column; gap: 10px; }
.asq { display: flex; align-items: center; gap: 14px; background: var(--surface); border-radius: 20px; padding: 12px 18px 12px 12px; opacity: 0; }
.asq u { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--n600); color: var(--papier); display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: var(--fd); font-size: 27px; font-weight: 700; }
.asq i { flex: none; width: 48px; height: 48px; border-radius: 14px; background: #FDFDFE; color: var(--terre); display: flex; align-items: center; justify-content: center; }
.asq b { font-size: 26px; font-weight: 700; color: var(--n700); line-height: 1.2; }
.asplat { display: flex; flex-direction: column; gap: 12px; background: var(--surface); border-radius: 26px; padding: 22px 24px; opacity: 0; }
.asplat > b { display: flex; align-items: center; gap: 12px; font-family: var(--fd); font-size: 32px; font-weight: 700; color: var(--n700); }
.asplat > b i { width: 52px; height: 52px; border-radius: 16px; background: var(--n600); color: var(--papier); display: flex; align-items: center; justify-content: center; }
.asplat span { display: flex; align-items: center; gap: 12px; font-size: 25px; font-weight: 700; color: var(--ardoise); opacity: 0; }
.asplat span svg { color: var(--terre); flex: none; }
.asdirect { display: flex; align-items: center; justify-content: space-between; gap: 14px; background: #F7E4DC; color: #8E3F20; border-radius: 22px; padding: 18px 22px; opacity: 0; }
.asdirect b { font-size: 27px; font-weight: 700; }
.asdirect span { display: inline-flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700; }

/* 3 · les chiffres */
.askv { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border-top: 1.5px solid var(--ligne2); padding-top: 14px; opacity: 0; }
.askv span { font-size: 27px; font-weight: 600; color: var(--ardoise); }
.askv b { font-family: var(--fd); font-size: 44px; font-weight: 700; color: var(--n700); font-variant-numeric: tabular-nums; }
.ascols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.ascol { display: flex; flex-direction: column; gap: 10px; border-radius: 26px; padding: 20px; opacity: 0; }
.ascol.good { background: rgba(13,148,136,.1); }
.ascol.bad { background: #F7E4DC; }
.ascol > small { font-size: 22px; font-weight: 700; color: var(--n700); line-height: 1.2; min-height: 54px; }
.ascol > div { display: flex; justify-content: space-between; font-size: 22px; font-weight: 600; color: var(--ardoise); font-variant-numeric: tabular-nums; }
.ascol > div b { font-weight: 700; color: var(--n700); }
.ascol > em { font-style: normal; display: flex; flex-direction: column; gap: 2px; border-top: 1.5px solid rgba(27,42,53,.12); padding-top: 10px; margin-top: 4px; }
.ascol > em span { font-size: 21px; font-weight: 700; color: var(--gris); }
.ascol > em b { font-family: var(--fd); font-size: 58px; font-weight: 700; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.ascol.good > em b { color: var(--ok); }
.ascol.bad > em b { color: #B45733; }

/* 4 · les preuves, mise en pratique */
.asproofs { display: flex; flex-direction: column; gap: 12px; }
.aspr { display: flex; align-items: center; gap: 16px; background: var(--surface); border-radius: 22px; padding: 10px 20px 10px 10px; opacity: 0; }
.aspr .asimg, .aspr i { flex: none; width: 120px; height: 88px; border-radius: 14px; }
.aspr i { background: #FDFDFE; color: var(--terre); display: flex; align-items: center; justify-content: center; }
.aspr b { font-size: 27px; font-weight: 700; color: var(--n700); line-height: 1.2; }

/* 5 · à retenir */
.asrc { display: flex; flex-direction: column; gap: 14px; }
.asline { display: flex; align-items: center; gap: 14px; border-radius: 22px; padding: 16px 24px; font-size: 26px; font-weight: 700; }
.asline.a { background: rgba(13,148,136,.1); color: var(--ok); }
.asline.b { background: var(--surface); color: var(--ardoise); font-size: 22px; padding: 12px 22px; }

html.f169 .ashook .asimg { height: 270px; }
html.f169 .asq b { font-size: 25px; }
html.f169 .asrc .rchip { padding: 16px 24px; }
html.f169 .asrc .rchip .ic { width: 62px; height: 62px; }
html.f169 .asrc .rchip b { font-size: 34px; }
html.f169 .asrc .rchip small { font-size: 21px; }
html.f169 .asline { font-size: 23px; padding: 13px 22px; }
html.f169 .asline.b { font-size: 20px; padding: 10px 20px; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const K = BaitlyKit.init({ strings: STRINGS, timeline: TIMELINE });
const { T, SYNC, h, icon, set, prog, lerp, easeOut, easeIn, slot, slotVis } = K;
const A = Academie.init(K);
const { P, L } = A;
const shown = (t, t0, d = .4) => easeOut(prog(t, t0, d));
const photo = (name) => h('img', { src: `../academie-shared/photos/${name}.jpg`, class: 'asimg', alt: '' });
const pill = (cls, ic, txt) => h('span', { class: `aspill ${cls}` }, icon(ic, 24), txt);
/** Couches successives d'une carte : chacune entre en montant, puis s'efface vers le haut quand la suivante arrive. */
const stack = (layers, times, t) => layers.forEach((el, i) => {
  const kIn = i ? shown(t, times[i] - .3, .5) : 1, kOut = i < layers.length - 1 ? shown(t, times[i + 1] - .3, .5) : 0;
  set(el, { opacity: kIn * (1 - kOut), transform: `translateY(${lerp(20, 0, kIn) - 20 * kOut}px)` });
});

const tag = A.tag(T.ep, T.theme);
const chapters = A.progress(SYNC.slots.length);
const heads = T.heads.map(([title, sub]) => A.head(null, title, sub));

/* 0 · accroche */
const q = A.abs(L.head.x, L.head.y, P ? 920 : L.head.w, null, 'q', `font-size:${P ? 80 : 72}px`);
const q1 = h('div', {}), q2 = h('div', { class: 'accent' });
q.append(q1, q2);
const w1 = K.words(q1, T.q[0]), w2 = K.words(q2, T.q[1], T.q[1].split(' '));
const HK = T.hook;
const hkPhoto = photo(HK.photo);
const hkRows = HK.rows.map(([ic, l, v]) => h('div', { class: 'asev' }, h('i', {}, icon(ic, 28)), h('div', {}, h('b', {}, l), v ? h('span', {}, v) : null)));
const hkWho = h('div', { class: 'aswho' }, icon('shield', 30), HK.who);
const hook = A.abs(L.card.x, 0, L.card.w, null, 'acard ashook');
hook.append(hkPhoto, ...hkRows, hkWho);

/* 1 · votre contrat */
const CT = T.contract, c1 = A.card();
const ctTiles = CT.tiles.map(([ic, b, s], i) => h('div', { class: `astile${i ? ' stay' : ''}` }, h('i', {}, icon(ic, 38)), h('b', {}, b), h('span', {}, s)));
const neq = h('div', { class: 'asneq' }, '≠');
const ctSteps = CT.steps.map(([ic, l]) => h('span', {}, icon(ic, 28), l));
c1.el.append(h('div', { style: 'flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px' },
  h('div', { class: 'astiles' }, ctTiles[0], neq, ctTiles[1]), h('div', { class: 'assteps' }, ctSteps)));

/* 2 · les six questions */
const PL = T.platform, c2 = A.card();
const qs = T.questions.map(([ic, l], i) => h('div', { class: 'asq' }, h('u', {}, String(i + 1)), h('i', {}, icon(ic, 26)), h('b', {}, l)));
const l2a = h('div', { class: 'aslayer' }, h('div', { class: 'asqs' }, qs));
const plItems = PL.items.map((l) => h('span', {}, icon('alert', 24), l));
const plat = h('div', { class: 'asplat' }, h('b', {}, h('i', {}, icon('shield', 28)), PL.title), ...plItems);
const direct = h('div', { class: 'asdirect' }, h('b', {}, PL.direct), h('span', {}, icon('x', 22), PL.none));
const l2b = h('div', { class: 'aslayer' }, plat, direct);
c2.el.append(h('div', { class: 'asfill' }, l2a, l2b));
const trap1 = A.trap(c2.el, T.trap);

/* 3 · les chiffres */
const NU = T.numbers, c3 = A.card();
const nuRows = NU.rows.map(([l, v]) => h('div', { class: 'askv' }, h('span', {}, l), h('b', {}, v)));
const cols = NU.cols.map(([title, rows, total], i) => h('div', { class: `ascol ${i ? 'bad' : 'good'}` }, h('small', {}, title),
  ...rows.map(([l, v]) => h('div', {}, h('span', {}, l), h('b', {}, v))), h('em', {}, h('span', {}, NU.pay), h('b', {}, total))));
c3.el.append(h('div', { style: 'flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px' },
  h('span', { class: 'alabel' }, T.illustrative), ...nuRows, h('div', { class: 'ascols' }, cols)));

/* 4 · les preuves, mise en pratique */
const PR = T.proofs, PQ = T.practice, c4 = A.card();
const prRows = PR.rows.map(([ph, l]) => h('div', { class: 'aspr' }, ph === 'msg' ? h('i', {}, icon('msg', 40)) : photo(ph), h('b', {}, l)));
const prWarn = pill('warn', 'alert', PR.warn);
const l4a = h('div', { class: 'aslayer' }, h('div', { class: 'asproofs' }, prRows), prWarn);
const pqSteps = PQ.steps.map(([ic, l]) => h('span', {}, icon(ic, 28), l));
const pqHour = pill('soft', 'clock', PQ.hour);
const l4b = h('div', { class: 'aslayer' }, h('span', { class: 'alabel' }, PQ.label), h('div', { class: 'assteps' }, pqSteps), pqHour);
c4.el.append(h('div', { class: 'asfill' }, l4a, l4b));

/* 5 · à retenir */
const R = T.recap, hdR = A.head(null, R.title, null);
const rc = A.abs(L.card.x, 0, L.card.w, null, 'asrc');
const rEls = R.rows.map(([ic, l, f]) => A.rchip(ic, l, null, f));
const app = h('div', { class: 'asline a', style: 'opacity:0' }, icon('camera', 30), R.app);
const note = h('div', { class: 'asline b', style: 'opacity:0' }, icon('filetext', 24), R.note);
rEls.forEach((e) => { e.style.opacity = 0; }); rc.append(...rEls, app, note);

let laidOut = false;
function layout() {
  if (laidOut) return;
  const zone = (el, top) => { const bottom = L.card.y + L.card.h; el.style.top = `${top + Math.max(0, (bottom - top - el.offsetHeight) / 2)}px`; };
  zone(hook, P ? q.offsetTop + q.offsetHeight + 60 : L.card.y);
  zone(rc, P ? hdR.el.offsetTop + hdR.el.offsetHeight + 40 : L.card.y);
  laidOut = true;
}
K.endMount();

function renderAt(t) {
  if (!laidOut && document.fonts.status === 'loaded') layout();
  const S = SYNC.slots.map((_, i) => slot(i));
  tag.render(t, .1, SYNC.end);
  chapters.render(t, S, SYNC.end);
  heads.forEach((hd, i) => hd.render(t, S[i + 1][0], S[i + 1][1]));

  /* 0 · accroche */
  const v0 = slotVis(t, 0, .4, .35);
  q.style.opacity = v0;
  K.titleIn(w1, t, S[0][0] + .1);
  K.titleIn(w2, t, SYNC.who - .1);
  A.rise(hook, v0, shown(t, SYNC.water - .4, .6), 60);
  A.rise(hkPhoto, 1, shown(t, SYNC.water - .2, .5), 14);
  [SYNC.water, SYNC.leave, SYNC.cancel].forEach((t0, i) => A.rise(hkRows[i], 1, shown(t, t0 + (i ? -.1 : .5)), 12));
  A.rise(hkWho, 1, shown(t, SYNC.who + .6), 10);

  /* 1 · votre contrat */
  c1.render(t, S[1][0] + .1, S[1][1]);
  A.rise(ctTiles[0], 1, shown(t, SYNC.home - .2, .45), 18);
  A.rise(neq, 1, shown(t, SYNC.guests - .2, .4), 6, `scale(${lerp(.6, 1, shown(t, SYNC.guests - .2, .4))})`);
  A.rise(ctTiles[1], 1, shown(t, SYNC.guests - .1, .45), 18);
  [SYNC.ask, SYNC.ask + 1.2, SYNC.write].forEach((t0, i) => A.rise(ctSteps[i], 1, shown(t, t0 - .15), 12));

  /* 2 · les six questions */
  const v2 = slotVis(t, 2);
  c2.render(t, S[2][0] + .1, S[2][1]);
  stack([l2a, l2b], [0, SYNC.trap1], t);
  [SYNC.n1, SYNC.n2, SYNC.n3, SYNC.n4, SYNC.n5, SYNC.n6].forEach((t0, i) => A.rise(qs[i], 1, shown(t, t0 - .15), 14));
  trap1.render(t, SYNC.trap1, v2);
  A.rise(plat, 1, shown(t, SYNC.some - .2), 14);
  [SYNC.some + 1.2, SYNC.some + 2.0, SYNC.only].forEach((t0, i) => A.rise(plItems[i], 1, shown(t, t0 - .1), 8));
  A.rise(direct, 1, shown(t, SYNC.direct - .1), 12);

  /* 3 · les chiffres */
  c3.render(t, S[3][0] + .1, S[3][1]);
  A.rise(nuRows[0], 1, shown(t, SYNC.rep - .15), 10); A.rise(nuRows[1], 1, shown(t, SYNC.lost - .6), 10);
  A.rise(cols[0], 1, shown(t, SYNC.fr - .15), 14); A.rise(cols[1], 1, shown(t, SYNC.without - .15), 14);

  /* 4 · les preuves, mise en pratique */
  c4.render(t, S[4][0] + .1, S[4][1]);
  stack([l4a, l4b], [0, SYNC.prat], t);
  [SYNC.p1, SYNC.p2, SYNC.p3].forEach((t0, i) => A.rise(prRows[i], 1, shown(t, t0 - .2), 14));
  A.rise(prWarn, 1, shown(t, SYNC.word - .1), 10);
  [SYNC.prat + .8, SYNC.each2, SYNC.file].forEach((t0, i) => A.rise(pqSteps[i], 1, shown(t, t0 - .15), 12));
  A.rise(pqHour, 1, shown(t, SYNC.hour - .1), 10);

  /* 5 · à retenir */
  hdR.render(t, S[5][0], S[5][1]);
  const v5 = slotVis(t, 5);
  [SYNC.k1, SYNC.k2, SYNC.k3, SYNC.k4].forEach((t0, i) => A.rise(rEls[i], v5, shown(t, t0 - .15, .45), 30));
  A.rise(app, v5, shown(t, SYNC.inc - .6, .45), 20); A.rise(note, v5, shown(t, SYNC.inc + 1.2, .45), 20);

  K.endRender(t, SYNC.end);
}
K.finalize(renderAt, layout);
</script>
</body>
</html>
