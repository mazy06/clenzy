const LANG = window.__LANG__ || new URLSearchParams(location.search).get('lang') || 'fr';
const T = window.STRINGS[LANG] || window.STRINGS.fr;
const RTL = T.dir === 'rtl';
const $ = (id) => document.getElementById(id);
document.documentElement.lang = LANG;
$('stage').dir = T.dir;
if (RTL) $('stage').classList.add('rtl');

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 5);          // ≈ cubic-bezier(0.22, 1, 0.36, 1)
const easeIn = (x) => Math.pow(clamp(x), 3);
const easeInOut = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const prog = (t, start, dur) => clamp((t - start) / dur);
const lerp = (a, b, p) => a + (b - a) * p;
const set = (el, css) => { for (const k in css) el.style[k] = css[k]; };
/** Visibilité d'un plan : fondu d'entrée puis de sortie. */
const vis = (t, a, b, fin = .35, fout = .35) => Math.min(easeOut(prog(t, a, fin)), 1 - easeIn(prog(t, b - fout, fout)));
/** +1 en lecture gauche → droite, −1 en arabe : les glissements suivent le sens de lecture. */
const DIR = RTL ? -1 : 1;
/** Points de synchro voix/image, recalés par langue (timeline.js). */
const SYNC = Object.assign({ click: 21.35, promise2: 24.5 }, (TL.lang || {})[LANG]);
const CLICK = SYNC.click;
const EXIT = Math.max(22.4, CLICK + .75);   // sortie des cartes, après la validation

/* ---------- construction du DOM (contenu statique, sans innerHTML) ---------- */
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false && c !== '') e.append(c);
  return e;
}
function icon(name, size) {
  const svg = $('ic-' + name).content.firstElementChild.cloneNode(true);
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  return svg;
}
function words(el, text, em = []) {
  return text.split(' ').map((w, i, arr) => {
    const hit = em.includes(w.replace(/[.,،:]/g, ''));
    const s = h('span', { class: 'w' + (hit ? ' accent' : '') }, w + (i < arr.length - 1 ? ' ' : ''));
    el.append(s);
    return s;
  });
}

$('archLabel').textContent = T.archLabel;
const t1Words = words($('t1'), T.t1, T.t1Em);

const tabEls = T.tabs.map(([f, l], i) => {
  const d = h('div', { class: 'tab' },
    h('span', { class: 'fav' }, f), h('span', { class: 'lbl' }, l), h('span', { class: 'x' }, '×'),
    h('span', { class: 'notif' }, String([3, 1, 2, 5, 1, 2][i % 6])));
  $('tabs').append(d);
  return d;
});
$('counterLbl').textContent = T.counter;
const kwEls = [];
T.kw.forEach((k, i) => {
  if (i) kwEls.push($('kw').appendChild(h('span', {}, '·')));
  kwEls.push($('kw').appendChild(h('span', {}, k)));
});

/* Planning */
const LOGO = { airbnb: '../../brand-book/assets/brands/airbnb.svg', booking: '../../brand-book/assets/brands/bookingdotcom.svg' };
const DW = 145, COL = 226;
const X = (d, hr = 0) => (d + hr / 24) * DW;
const ST = {
  pending: { bg: '#E0C89B', ink: '#2B211A', dark: true },
  confirmed: { bg: '#9A6C3A', ink: '#FFFFFF', dark: false },
  checked_in: { bg: '#5C3A21', ink: '#FFFFFF', dark: false },
  checked_out: { bg: '#A89684', ink: '#2B211A', dark: true },
};
const P = T.plan;
// Photo du voyageur dans l'avatar (comme GuestAvatar dans le produit).
const GUEST_PHOTOS = { sara: 'g2.jpg', lea: 'g9.jpg', jad: 'g3.jpg', nadia: 'g8.jpg', omar: 'g5.jpg', ali: 'g12.jpg', karim: 'g1.jpg' };
const guestImg = (key) => GUEST_PHOTOS[key] ? h('img', { src: '../../brand-book/assets/guests/' + GUEST_PHOTOS[key], alt: '' }) : null;
function bar(b) {
  const st = ST[b.status];
  const l = X(...b.from), r = X(...b.to);
  const [av, name] = P.guests[b.guest];
  const glass = st.dark
    ? 'background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 2px rgba(43,33,26,.18)'
    : 'background:rgba(0,0,0,.20);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.22)';
  const avSt = st.dark
    ? 'border:3px solid rgba(43,33,26,.30);background:rgba(43,33,26,.12)'
    : 'border:3px solid rgba(255,255,255,.55);background:rgba(255,255,255,.22)';
  const badges = [];
  if (b.fee) badges.push(h('span', { class: 'bdg fee', style: 'color:#2F9E8D' }, icon('broom', 28), h('span', {}, P.prices.fee)));
  if (b.wrench) badges.push(h('span', { class: 'bdg', style: 'color:#4F86C6' }, icon('wrench', 26)));
  if (b.combo) badges.push(h('span', { class: 'bdg combo' }, '+' + b.combo));
  const logo = P.logos[b.guest];
  if (logo) badges.push(h('span', { class: 'bdg' }, h('img', { src: LOGO[logo], alt: '' })));
  const price = P.prices[b.guest];
  return h('div', { class: 'bar', style: `inset-inline-start:${l}px;width:${r - l}px;background:${st.bg};color:${st.ink}` },
    b.av && av ? h('span', { class: 'av', style: avSt }, guestImg(b.guest) || av) : null,
    h('span', { class: 'tx' }, h('small', {}, P.nights(b.nights)), h('b', {}, name)),
    b.price && price ? h('span', { class: 'pill', style: glass }, icon('check', 22), ' ' + price) : null,
    badges.length ? h('span', { class: 'bdgs' }, badges) : null);
}
// Contenu choisi pour respecter le repli du code : le nom tient toujours.
const ROWS = [
  [{ status: 'checked_out', from: [0, 15], to: [1, 11], guest: 'lea', nights: 1, combo: 2 },
   { status: 'confirmed', from: [1, 15], to: [4, 11], guest: 'sara', av: true, nights: 3, price: true, fee: true }],
  [{ status: 'checked_in', from: [0, 15], to: [3, 11], guest: 'jad', av: true, nights: 3, price: true, wrench: true },
   { status: 'pending', from: [3, 15], to: [5, 11], guest: 'nadia', av: true, nights: 2, combo: 1 }],
  [{ blocked: true, from: 1, to: 3 },
   { orphan: true, day: 3 },
   { status: 'confirmed', from: [3, 15], to: [6, 11], guest: 'omar', av: true, nights: 3 }],
  [{ status: 'checked_out', from: [0, 15], to: [1, 11], guest: 'ali', nights: 1, combo: 1 },
   { status: 'confirmed', from: [1, 15], to: [4, 11], guest: 'karim', av: true, nights: 3, price: true }],
];
const WE = new Set(P.weekend);
const plan = $('plan');
plan.append(h('div', { class: 'ph' },
  h('div', { class: 'pcol' }, h('small', {}, P.corner)),
  h('div', { class: 'pdays' }, P.days.map((d, i) =>
    h('div', { class: 'pday' + (WE.has(i) ? ' we' : '') + (i === 1 ? ' today' : '') }, h('span', {}, d), h('b', {}, String(12 + i)))))));
const barEls = [];
ROWS.forEach((items, ri) => {
  const cells = h('div', { class: 'pcells' }, P.days.map((_, i) => h('i', { class: WE.has(i) ? 'we' : '' })));
  const track = h('div', { class: 'ptrack' }, cells);
  items.forEach((it) => {
    let el;
    if (it.blocked) {
      el = h('div', { class: 'blocked', style: `inset-inline-start:${X(it.from)}px;width:${X(it.to - it.from)}px` }, icon('lock', 22), ' ' + P.blocked);
    } else if (it.orphan) {
      // Intervention non rattachée : carré blanc à filet, hors brique, à sa date.
      el = h('div', { class: 'bdg orphan', style: `inset-inline-start:${X(it.day) + 4}px;color:#4F86C6` }, icon('wrench', 26));
    } else {
      el = bar(it);
    }
    el.dataset.row = ri;
    track.append(el);
    barEls.push(el);
  });
  const [rowName, city] = P.rows[ri];
  plan.append(h('div', { class: 'pr' }, h('div', { class: 'pcol' }, h('b', {}, rowName), h('small', {}, city)), track));
});
const now = h('div', { id: 'now', style: `inset-inline-start:${COL + X(1, 10)}px` });
plan.append(now);
const t4Words = words($('t4'), T.t4, T.t4Em);

/* Cartes de validation (HITL) : agent + statut, titre, contexte chiffré,
   métriques, jauge, actions hiérarchisées. Revenue est « à valider ». */
const A = T.agents, R = A.rev;
const compact = ([k, line, sub, chip], ic, top, done) => h('div', { class: 'agent compact', style: `top:${top}px` },
  h('span', { class: 'ag-av' }, icon(ic, 32)),
  h('div', { style: 'flex:1;min-width:0' }, h('div', { class: 'ag-k' }, k), h('div', { class: 'ag-line' }, line), h('div', { class: 'ag-sub' }, sub)),
  h('span', { class: 'chip ' + (done ? 'ok' : 'auto') }, done ? icon('check', 22) : null, chip));
const commCard = compact(A.comm, 'chat', 330, false);
const revChip = h('span', { class: 'chip wait' }, R.wait);
const propVal = h('span', {}, String(R.from));
const occVal = h('span', {}, '0');
const fill = h('div', { class: 'fill' });
const okBtn = h('span', { class: 'btn ok' }, icon('check', 26), R.approve);
const btnRow = h('div', { class: 'btns' }, okBtn, h('span', { class: 'btn adj' }, R.adjust), h('span', { class: 'btn no' }, R.refuse));
const approved = h('div', { class: 'approved' }, icon('check', 30), R.approved);
const revCard = h('div', { class: 'agent hero', style: 'top:492px' },
  h('div', { class: 'ag-head' },
    h('span', { class: 'ag-av' }, icon('trend', 32)),
    h('div', { class: 'ag-id' }, h('b', {}, R.name), h('small', {}, R.meta)),
    revChip),
  h('div', { class: 'ag-title' }, R.title),
  h('div', { class: 'ag-copy' }, R.copy[0], h('b', {}, R.copy[1]), R.copy[2]),
  h('div', { class: 'metrics' },
    h('div', {}, h('small', {}, R.current), h('b', {}, String(R.from), h('i', {}, R.unit))),
    h('div', { class: 'prop' }, h('small', {}, R.proposed), h('b', {}, propVal, h('i', {}, R.unit))),
    h('div', {}, h('small', {}, R.floor), h('b', {}, R.floorVal, h('i', {}, R.unit)))),
  h('div', { class: 'gauge' },
    h('div', { class: 'lbl' }, h('span', {}, R.occ), h('b', {}, occVal, ' %')),
    h('div', { class: 'track' }, fill, h('div', { class: 'seuil' }), h('div', { class: 'seuil-l' }, R.seuil))),
  h('div', { class: 'ag-foot' }, btnRow, approved));
const opsCard = compact(A.ops, 'broom', 1092, true);
$('agents').append(commCard, revCard, opsCard);
const agentEls = [commCard, revCard, opsCard];
const t5Words = words($('t5'), T.t5, T.t5Em);
/** Position d'un élément dans la scène, hors transformations (offsets cumulés). */
function posIn(el, root) {
  let x = 0, y = 0;
  for (let n = el; n && n !== root; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; }
  return { x, y };
}
let approveTarget = null;

$('t6a').textContent = T.t6[0];
$('t6b').textContent = T.t6[1];
$('ctaBtn').textContent = T.cta;

// Canaux réellement connectés au planning, dont les plateformes saoudiennes.
const OTA_FILES = {
  airbnb: ['airbnb-wordmark.png', 42], booking: ['booking-wordmark.png', 35], gathern: ['gathern-wordmark.webp', 31],
  vrbo: ['vrbo-wordmark.svg', 42], mabeet: ['mabeet-wordmark.png', 48], expedia: ['expedia-wordmark.png', 38], agoda: ['agoda-wordmark.svg', 54],
};
$('otaTitle').textContent = T.otaTitle;
const otaTrack = $('otaTrack');
for (let k = 0; k < 2; k++) {
  T.otas.forEach((o) => {
    const [f, hgt] = OTA_FILES[o];
    otaTrack.append(h('img', { src: '../../brand-book/assets/brands/' + f, alt: '', style: `height:${hgt}px` }));
  });
}
const factEls = T.facts.map(([b, l]) => {
  const el = h('span', { class: 'fact' }, h('b', {}, b), l || null);
  $('facts').append(el);
  return el;
});

/* ---------- rendu à l'instant t ---------- */
function titleIn(ws, t, start, stagger = .06) {
  ws.forEach((w, i) => {
    const p = easeOut(prog(t, start + i * stagger, .45));
    set(w, { opacity: p, transform: `translateY(${lerp(22, 0, p)}px)` });
  });
}
let subKey = null;
function renderSubtitle(t) {
  const s = T.subtitles.find((x) => t >= x.from && t < x.to);
  if (!s) { $('sub').style.opacity = 0; return; }
  if (subKey !== s) {
    subKey = s;
    $('subBox').replaceChildren(...[s.text, s.em ? h('em', {}, s.em) : null, s.after || null].filter(Boolean));
  }
  $('sub').style.opacity = vis(t, s.from, s.to, .15, .15);
}

function renderAt(t) {
  /* A · 0 → 3.4 */
  const aOut = easeIn(prog(t, 3.0, .45));
  set($('arch'), { opacity: easeOut(prog(t, 0, .6)) * (1 - aOut), transform: `translateY(${-60 * aOut}px)` });
  $('arch').firstElementChild.style.transform = `scale(${lerp(1.08, 1.02, easeOut(prog(t, 0, 3.2)))})`;
  titleIn(t1Words, t, .35);
  set($('t1'), { opacity: 1 - aOut, transform: `translateY(${-60 * aOut}px)` });

  /* B · onglets 3.2 → 12 */
  const collapse = easeInOut(prog(t, 10.9, .9));
  tabEls.forEach((el, i) => {
    const start = 3.3 + i * .16;
    const p = easeOut(prog(t, start, .5));
    const baseY = 400 + i * 96;
    const rot = (i % 2 ? 1 : -1) * (.8 + (i % 3) * .4);
    const vib = t > 6.4 && t < 7.4 ? Math.sin((t - 6.4) * Math.PI * 6) * 3 : 0;   // 3 cycles ±3 px
    const y = lerp(baseY - 260, baseY, p);
    const fy = lerp(y, 780 - 59, collapse);
    const sc = lerp(1, .04, collapse);
    set(el, { opacity: (t < start ? 0 : p) * (1 - easeIn(prog(t, 11.4, .4))),
      transform: `translate(${vib}px, ${fy}px) rotate(${rot * (1 - collapse)}deg) scale(${sc})` });
    el.lastElementChild.style.opacity = i % 2 === 1 ? easeOut(prog(t, 6.6 + (i % 6) * .22, .3)) : 0;
  });
  $('count').textContent = String(Math.round(clamp((t - 3.3) / (tabEls.length * .16)) * tabEls.length));
  $('counter').style.opacity = vis(t, 3.3, 11.0, .3, .5);
  const kwT = [6.5, 6.5, 7.35, 7.35, 8.05, 8.05, 8.8];
  kwEls.forEach((el, i) => {
    const p = easeOut(prog(t, kwT[i], .35));
    set(el, { opacity: p * (1 - easeIn(prog(t, 10.6, .4))), transform: `translateY(${lerp(16, 0, p)}px)` });
  });

  /* C · logo tracé → planning 11.9 → 16.4 */
  const draw = easeInOut(prog(t, 11.9, 1.2));
  set($('housePath'), { strokeDasharray: '100 100', strokeDashoffset: String(100 - 100 * draw) });
  const houseOut = easeIn(prog(t, 13.1, .5));
  set($('house'), { opacity: (t < 11.9 ? 0 : 1) * (1 - houseOut), transform: `scale(${lerp(1, 1.6, houseOut)})` });
  const planIn = easeOut(prog(t, 13.2, .8));
  const planOut = easeIn(prog(t, EXIT, .5));
  const planDim = easeOut(prog(t, 16.5, .6));
  set($('plan'), { opacity: planIn * lerp(1, .14, planDim) * (1 - planOut), transform: `translateY(${lerp(40, 0, planIn) - 30 * planDim}px)` });
  barEls.forEach((el) => {
    // Les briques glissent depuis leur heure d'arrivée, une rangée après l'autre,
    // dans le sens de lecture.
    const p = easeOut(prog(t, 13.6 + (+el.dataset.row) * .18, .6));
    const cut = lerp(100, 0, p);
    set(el, { opacity: p,
      clipPath: RTL ? `inset(-10px -10px -10px ${cut}%)` : `inset(-10px ${cut}% -10px -10px)`,
      transform: `translateX(${lerp(-24 * DIR, 0, p)}px)` });
  });
  now.style.opacity = easeOut(prog(t, 14.6, .4));
  titleIn(t4Words, t, 14.2);
  $('t4').style.opacity = 1 - easeIn(prog(t, 16.2, .35));

  /* D · cartes de validation 16.4 → 22.8 */
  agentEls.forEach((el, i) => {
    const p = easeOut(prog(t, 16.8 + i * .18, .7));
    const out = easeIn(prog(t, EXIT, .45));
    set(el, { opacity: p * (1 - out), transform: `translateY(${lerp(900, 0, p) - 40 * out}px)` });
  });
  // L'agent a simulé : occupation mesurée puis prix proposé (compteurs).
  const occ = easeOut(prog(t, 17.9, .9));
  occVal.textContent = String(Math.round(42 * occ));
  fill.style.width = (42 * occ) + '%';
  propVal.textContent = String(Math.round(lerp(R.from, R.to, easeInOut(prog(t, 18.6, .9)))));
  // Curseur : vient sur « Approuver » et le presse à la fin de la réplique.
  if (!approveTarget) {
    const pb = posIn(okBtn, $('stage'));
    approveTarget = { x: pb.x + okBtn.offsetWidth * .55, y: pb.y + okBtn.offsetHeight * .55 };
  }
  const cp = easeInOut(prog(t, CLICK - 1.05, .9));
  const cx0 = RTL ? 180 : 860;
  set($('cursor'), { opacity: vis(t, CLICK - 1.25, CLICK + .95, .25, .3), transform: `translate(${lerp(cx0, approveTarget.x, cp)}px, ${lerp(1560, approveTarget.y, cp)}px)` });
  okBtn.style.background = t >= CLICK && t < CLICK + .15 ? '#1B3155' : '';
  const done = easeOut(prog(t, CLICK + .2, .35));
  set(btnRow, { opacity: 1 - done, transform: `translateY(${-10 * done}px)` });
  set(approved, { opacity: done, transform: `translateY(${lerp(10, 0, done)}px)` });
  const isDone = t >= CLICK + .2;
  if (revChip.dataset.done !== String(isDone)) {
    revChip.dataset.done = String(isDone);
    revChip.className = 'chip ' + (isDone ? 'ok' : 'wait');
    revChip.replaceChildren(...(isDone ? [icon('check', 22), R.ok] : [R.wait]));
  }
  revCard.style.borderColor = `color-mix(in srgb, #9A6C3A ${Math.round(45 * done)}%, #D5DEE7)`;
  titleIn(t5Words, t, CLICK - .35);
  $('t5').style.opacity = 1 - easeIn(prog(t, EXIT, .4));

  /* E · promesse 22.8 → 26.6 */
  $('glow').style.opacity = easeOut(prog(t, 22.6, .8));
  const a = easeOut(prog(t, 23.0, .55)), b = easeOut(prog(t, SYNC.promise2, .55));
  const eOut = easeIn(prog(t, 26.2, .45));
  set($('t6a'), { opacity: a * (1 - eOut), transform: `translateY(${lerp(20, 0, a) - 30 * eOut}px)` });
  set($('t6b'), { opacity: b * (1 - eOut), transform: `translateY(${lerp(20, 0, b) - 30 * eOut}px)` });

  /* F · logo + CTA 26.6 → fin */
  const lIn = easeOut(prog(t, 26.6, .6));
  set($('logo'), { opacity: lIn, transform: `translateY(${lerp(24, 0, lIn)}px)` });
  const trace = easeInOut(prog(t, 26.6, 1.0));
  set($('lTrait'), { strokeDasharray: '100 100', strokeDashoffset: String(100 - 100 * trace) });
  // Packets : cycle 5 s linéaire, requête sur la 1re moitié, réponse sur la 2de.
  const cyc = (((t - 27.6) % 5) + 5) % 5 / 5;
  const pk = t >= 27.6;
  set($('lReq'), { opacity: pk && cyc < .5 ? 1 : 0, strokeDashoffset: String(-lerp(0, 94, cyc / .5)) });
  set($('lRes'), { opacity: pk && cyc >= .5 ? 1 : 0, strokeDashoffset: String(-lerp(94, 0, (cyc - .5) / .5)) });
  const cIn = easeOut(prog(t, 27.5, .6));
  set($('cta'), { opacity: cIn, transform: `translateY(${lerp(24, 0, cIn)}px)` });
  const hover = easeOut(prog(t, 29.6, .2)) * (1 - easeOut(prog(t, 29.8, .3)));
  $('ctaBtn').style.background = `color-mix(in srgb, #1B2A35 ${Math.round(hover * 100)}%, #25406E)`;

  /* Bandeau des canaux : planning + agents, puis carte de fin */
  const otaVis = Math.max(vis(t, 12.6, EXIT + .1, .5, .45), vis(t, 27.3, 34, .5, .1));
  set($('otas'), { opacity: otaVis, transform: `translateY(${lerp(-16, 0, otaVis)}px)` });
  const half = otaTrack.scrollWidth / 2 + 42;           // une série + un demi-écart
  otaTrack.style.transform = `translateX(${-DIR * ((t * 42) % half)}px)`;

  /* Faits produit sous le CTA */
  factEls.forEach((el, i) => {
    const p = easeOut(prog(t, 28.3 + i * .15, .5));
    set(el, { opacity: p, transform: `translateY(${lerp(18, 0, p)}px)` });
  });

  renderSubtitle(t);
}
window.renderAt = renderAt;
// La cible du curseur dépend des polices : recalcul une fois celles-ci chargées.
document.fonts.ready.then(() => { approveTarget = null; });
renderAt(0);

/* ---------- aperçu temps réel dans le navigateur (désactivé au rendu) ---------- */
if (!window.__RENDER__) {
  const stage = $('stage');
  const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth / 1080, innerHeight / 1920)})`; };
  addEventListener('resize', fit); fit();
  let t0 = performance.now(), offset = 0, paused = false, cur = 0;
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') paused = !paused;
    if (e.code === 'ArrowRight') cur = Math.min(TL.duration, cur + 1);
    if (e.code === 'ArrowLeft') cur = Math.max(0, cur - 1);
    offset = cur; t0 = performance.now();
  });
  const loop = () => {
    cur = paused ? offset : (offset + (performance.now() - t0) / 1000) % TL.duration;
    renderAt(cur);
    $('hud').textContent = `${LANG} · ${cur.toFixed(2)} s${paused ? ' (pause)' : ''}`;
    requestAnimationFrame(loop);
  };
  loop();
}
</script>
</body>
