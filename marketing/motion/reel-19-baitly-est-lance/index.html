  À quoi sert ce fichier : annoncer le lancement de Baitly en un tour du produit de ~96 s, un plan
  par réplique (les plans suivent la voix, slots recalés par align-vo.py). Mode Jour, bascule sur
  le bleu nuit pour la promesse et l'écran de fin.
  Déroulé : accroche (tout arrive en même temps) → logo → pour qui → planning + site direct →
  agents IA → messagerie → livret → prestations et activités partenaires → objets connectés →

  shared/src/brand/baitlyLogo.ts. Images générées : scène d'accueil + illustrations du catalogue.
  Vérité produit : données fictives (« Scène illustrative ») ; certaines fonctionnalités sont en
  cours de déploiement, mention portée par l'écran de fin (décision du 09/10/2026).
  Zones de sécurité 9:16 : titres sous 250 px, rien d'important au-delà de 1 540 px.
  Rendu : node ../render.mjs reel-19-baitly-est-lance --lang=fr
  À qui il s'adresse : motion designer / marketing, développeur.
-->

<script>
const K = BaitlyKit.init({ strings: STRINGS, timeline: TIMELINE });
const { T, SYNC, h, icon, set, prog, lerp, easeOut, easeInOut, vis, slot, slotVis, stage } = K;
const PH = '../../brand-book/assets/photos/';
const ED = '../../../client/site/assets/photos/editorial/';
const CAT = '../../../client/public/images/catalog/';
const SVGNS = 'http://www.w3.org/2000/svg';
const rise = (el, o, p, dy = 40) => set(el, { opacity: o * p, transform: `translateY(${lerp(dy, 0, p)}px)` });

/* Logo validé (barre latérale) : géométrie de shared/src/brand/baitlyLogo.ts. */
const MARK_PATH = 'M66 103.5 A8.5 8.5 0 1 1 66 86.5 A8.5 8.5 0 1 1 66 103.5 V126 Q66 140 52 140 H44 Q24 140 24 120 V69 Q24 62 30 58 L71 30 Q80 24 89 30 L130 58 Q136 62 136 69 V120 Q136 140 116 140 H108 Q94 140 94 126 V103.5 A8.5 8.5 0 1 1 94 86.5 A8.5 8.5 0 1 1 94 103.5';
function logo(size) {
  const svg = document.createElementNS(SVGNS, 'svg');
  for (const [k, v] of Object.entries({ width: size, height: size, viewBox: '0 0 160 160', fill: 'none' })) svg.setAttribute(k, v);
  const mk = (w) => { const p = document.createElementNS(SVGNS, 'path'); for (const [k, v] of Object.entries({ d: MARK_PATH, pathLength: 100, stroke: 'currentColor', 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' })) p.setAttribute(k, v); svg.append(p); return p; };
  const base = mk(6.8), flow = mk(8.8);
  flow.setAttribute('stroke-dasharray', '14 400');
  const wm = h('span', { class: 'wm', style: `font-size:${size * 70 / 108}px;transform:translateY(${size * 5 / 108}px)` }, 'baitly.');
  const el = h('div', { class: 'lg', style: `gap:${size * 8 / 108}px` }, svg, wm);
  /** t0 : début du tracé (1,1 s), wordmark à +0,7 s, flux monochrome (aller-retour 3 s) dès +1,3 s. */
  function render(t, t0) {
    const d = easeInOut(prog(t, t0, 1.1));
    set(base, { strokeDasharray: '100 100', strokeDashoffset: String(100 - 100 * d) });
    const f = easeOut(prog(t, t0 + 1.3, .5));
    base.style.opacity = String(lerp(1, .42, f));
    const leg = Math.max(0, t - t0 - 1.3) / 3, k = Math.floor(leg), x = leg - k;
    const e = x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    flow.style.opacity = String(f);
    flow.style.strokeDashoffset = String(-86 * (k % 2 ? 1 - e : e));
    const w = easeOut(prog(t, t0 + .7, .6));
    set(wm, { opacity: w, transform: `translate(${lerp(-16, 0, w)}px, ${size * 5 / 108}px)` });
  }
  return { el, render };
}

/* Titres de plan : sur-titre + deux lignes (la 2e en Terre cuite). */
function head(key) {
  const [eb, l1, l2] = T.heads[key];
  const el = K.abs('h-' + key, 'head');
  const a = h('span', { class: 'eyebrow' }, eb), b = h('div', { class: 'title' }, l1), c = h('div', { class: 'title accent' }, l2);
  el.append(a, b, c);
  return (t, i) => { const v = slotVis(t, i), s = slot(i)[0]; rise(a, v, easeOut(prog(t, s, .45)), 14); rise(b, v, easeOut(prog(t, s + .08, .5)), 20); rise(c, v, easeOut(prog(t, s + .23, .5)), 20); };
}
const illus = K.abs('illus'); illus.textContent = T.illustrative;

/* 0 · accroche */
const hook = K.abs('hook', 'title');
const hk1 = h('div', {}, T.hook.title[0]), hk2 = h('div', { class: 'accent' }, T.hook.title[1]);
hook.append(hk1, hk2);
const hks = T.hook.cards.map(([ic, b, s], i) => {
  const dot = h('i', { class: 'dot' });
  const el = h('div', { class: 'hk card', style: `top:${630 + i * 178}px` }, h('span', { class: 'ic' }, icon(ic, 34)), h('div', {}, h('b', {}, b), h('small', {}, s)), dot);
  stage.append(el); return { el, dot };
});

/* 1 · logo */
const brand = K.abs('brand');
const L1 = logo(190); brand.append(L1.el);
const tagline = K.abs('tagline', 'title');

function renderAt(t) {
  /* 0 */
  const v0 = slotVis(t, 0), s0 = slot(0)[0];
  rise(hk1, v0, easeOut(prog(t, s0, .5)), 24); rise(hk2, v0, easeOut(prog(t, s0 + .18, .5)), 24);
  hks.forEach(({ el, dot }, i) => { const p = easeOut(prog(t, s0 + .5 + i * .85, .5)); set(el, { opacity: v0 * p, transform: `translateY(${lerp(-28, 0, p)}px) rotate(${lerp(i % 2 ? 2 : -2, 0, p)}deg)` }); dot.style.opacity = i === 3 ? easeOut(prog(t, s0 + 3.4, .3)) : 0; });

  /* 1 */
  const v1 = slotVis(t, 1, .3, .4), s1 = slot(1)[0];
  brand.style.opacity = v1; L1.render(t, s1 + .05);
  rise(tg, v1, easeOut(prog(t, SYNC.reveal + .9, .55)), 20);

  /* 2 */
  const v2 = slotVis(t, 2), s2 = slot(2)[0];
  hWho(t, 2);
  const pa = easeOut(prog(t, SYNC.own - .3, .6)), pb = easeOut(prog(t, SYNC.conc - .3, .6));
  set(archA, { opacity: v2 * pa, transform: `translateY(${lerp(50, 0, pa)}px)` }); set(archB, { opacity: v2 * pb, transform: `translateY(${lerp(50, 0, pb)}px)` });
  rise(whoA, v2, easeOut(prog(t, SYNC.own, .5)), 16); rise(whoB, v2, easeOut(prog(t, SYNC.conc, .5)), 16);

  /* 3 */
  const v3 = slotVis(t, 3), s3 = slot(3)[0]; hPlan(t, 3);
  rise(plan, v3, easeOut(prog(t, s3 + .1, .6)), 50);
  K.planningEnter(t, s3 + .3, pl);
  const nw = pl.byKey.new, pn = easeOut(prog(t, s3 + 1.6, .5));
  set(nw, { opacity: pn, clipPath: 'none', transform: `translateY(${lerp(-40, 0, pn)}px)` });
  rise(chans, v3, easeOut(prog(t, s3 + .8, .5)), 16);
  rise(site, v3, easeOut(prog(t, SYNC.site - .2, .6)), 60);

  /* 4 · les dix agents */
  const va = slotVis(t, 4), sa = slot(4)[0]; hTeam(t, 4);
  agcs.forEach(({ e, id }, i) => { const p = easeOut(prog(t, sa + .3 + i * .12, .5)); set(e, { opacity: va * p, transform: `translateY(${lerp(30, 0, p)}px) scale(${lerp(.9, 1, p)})` }); e.classList.toggle('hl', t >= SYNC.ten && T.focus.includes(id)); });

  /* 5 · Avis & Réputation */
  const vr = slotVis(t, 5), sr = slot(5)[0]; hRep(t, 5);
  rise(ahRep, vr, easeOut(prog(t, sr + .1, .55)), 30);
  rise(rvCard, vr, easeOut(prog(t, sr + .5, .55)), 30);
  rise(rvReply, vr, easeOut(prog(t, SYNC.hard - .2, .55)), 30);
  K.typeText(rvTxt, RP.reply, t, SYNC.hard + .3, 34);
  rise(rvChip, 1, easeOut(prog(t, SYNC.act, .45)), 10);

  /* 6 · Conformité */
  const vc = slotVis(t, 6), sc = slot(6)[0]; hCmp(t, 6);
  rise(ahCmp, vc, easeOut(prog(t, sc + .1, .55)), 30);
  rise(cCard, vc, easeOut(prog(t, sc + .5, .55)), 30);
  cRows.forEach((r, i) => rise(r, 1, easeOut(prog(t, SYNC.tax + i * .6, .45)), 10));
  K.stampIn(cStamp, t, SYNC.auth); cStamp.style.opacity = String(Math.min(parseFloat(cStamp.style.opacity || 0), vc));
  rise(cDest, vc, easeOut(prog(t, SYNC.auth + .5, .5)), 16);

  /* 7 · Revenue */
  const vv = slotVis(t, 7), sv = slot(7)[0]; hRev(t, 7);
  rise(ahRev, vv, easeOut(prog(t, sv + .1, .55)), 30);
  rise(rvBox, vv, easeOut(prog(t, sv + .4, .55)), 30);
  bw.grow(t, SYNC.live - .2);
  const ad = prog(t, SYNC.adj, .9);
  bw.morph(RV.dipIdx, RV.values[RV.dipIdx], RV.dipTo, ad); bw.morph(RV.peakIdx, RV.values[RV.peakIdx], RV.peakTo, ad);

  K.bubbleIn(bG, t, s5 + .4); K.dotsAt(dots, t, s5 + 1.0, SYNC.reply); K.bubbleIn(bR, t, SYNC.reply);

  const p6 = easeOut(prog(t, s6, .6)); set(ph2.el, { opacity: v6 * p6, transform: `translateY(${lerp(60, 0, p6)}px) scale(.82)` });
  gsEls.forEach((g, i) => { const on = t >= SYNC.x[i] - .1 && (i === 2 || t < SYNC.x[i + 1] - .1); g.classList.toggle('on', on); });

  /* 7 */
  const v7 = slotVis(t, 13), s7 = slot(13)[0]; hShop(t, 13);
  rise(lblOwn, v7, easeOut(prog(t, s7 + .3, .4)), 10);
  ownT.forEach((e, i) => rise(e, v7, easeOut(prog(t, s7 + .5 + i * .2, .5)), 30));
  rise(lblPt, v7, easeOut(prog(t, SYNC.gyg - .5, .4)), 10);
  ptT.forEach((e, i) => rise(e, v7, easeOut(prog(t, SYNC.gyg - .3 + i * .45, .5)), 30));
  whs.forEach((e, i) => rise(e, v7, easeOut(prog(t, SYNC.bk - .6 + i * .3, .45)), 14));
